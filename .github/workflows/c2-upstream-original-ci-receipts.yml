name: C2 original external source CI provenance only - four blinded PRs
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/c2-upstream-original-ci-receipts.yml
      - packages/quality-gates/c2-upstream-original-ci-receipts.cjs
      - scripts/c2-upstream-original-ci-receipts.cjs
      - tests/unit/c2-upstream-original-ci-receipts.test.cjs
      - docs/quality/C2-FOUR-EXTERNAL-PROSPECTIVE-PR-METADATA-20261022.json
permissions:
  contents: read
  checks: read
  pull-requests: read
jobs:
  verify-upstream-original-ci-without-unblinding:
    if: >-
      github.event.repository.id == 1418338512 &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'cardenaspiero255-lang'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout immutable trusted main push SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup pinned Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Execute complete fail-closed structural and unit suite
        run: npm run check
      - name: Prepare strict pinned metadata-only candidate indexes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/c2-upstream-native-ci"
          mkdir -p "$root/output"
          node - "$root/candidates.tsv" <<'NODE'
          const fs=require('node:fs');
          const {prepareIndependentOracleQuarantine}=require('./packages/quality-gates/c2-independent-oracle-quarantine.cjs');
          const m=JSON.parse(fs.readFileSync('docs/quality/C2-FOUR-EXTERNAL-PROSPECTIVE-PR-METADATA-20261022.json','utf8'));
          const result=prepareIndependentOracleQuarantine(m);
          if(result.candidateCount!==4||result.candidateSourceRead!==false||
             result.originalOraclesAttested!==0||result.truthSealed!==false)throw Error('C2_UPSTREAM_ORIGINAL_CI_BLOCKED');
          const data=m.candidates.map((c,i)=>[i,c.repository,c.pr,c.baseSha,c.headSha,c.createdAt].join('|')).join('\n')+'\n';
          fs.writeFileSync(process.argv[2],data,{flag:'wx',mode:0o600});
          NODE
      - name: Authenticate read-only native base and head CI checks from GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/c2-upstream-native-ci"
          processed=0
          while IFS='|' read -r idx repo pr base head created; do
            test "$idx" = "$processed"
            # READ-ONLY original PR identity. Do not query PR files, title, patch, tests or issue text.
            gh api "/repos/$repo/pulls/$pr" --jq               '{repository:.base.repo.full_name,pr:.number,createdAt:.created_at,
                baseSha:.base.sha,headSha:.head.sha}' > "$root/pinned-pr.json"
            jq -e --arg repo "$repo" --argjson pr "$pr" \
              --arg base "$base" --arg head "$head" --arg created "$created" \
              '.repository==$repo and .pr==$pr and
               .createdAt==$created and
               (.baseSha|test("^[a-f0-9]{40}$")) and
               (.headSha|test("^[a-f0-9]{40}$"))' "$root/pinned-pr.json" >/dev/null
            # The live PR may move AFTER preregistration. Never substitute
            # its new SHA for the original preselected Git objects.
            cp "$root/pinned-pr.json" "$root/pr-$idx.json"
            for stage in base head; do
              if [ "$stage" = base ]; then sha="$base"; else sha="$head"; fi
              # Verify the ORIGINAL frozen Git object still exists, even if
              # the external PR has a newer live HEAD. No source blob opened.
              frozen="$(gh api "/repos/$repo/git/commits/$sha" --jq '.sha')"
              test "$frozen" = "$sha"
              # Check-run metadata, NOT JUnit/CI logs or candidate source. Fetch every page.
              gh api --paginate "/repos/$repo/commits/$sha/check-runs?per_page=100" --jq \
                '.check_runs[]|{id,name,headSha:.head_sha,status,conclusion,appSlug:.app.slug}' \
                > "$root/check-$idx-$stage.jsonl"
              jq -s '.' "$root/check-$idx-$stage.jsonl" > "$root/candidate-$idx-$stage.json"
              expected="$(gh api "/repos/$repo/commits/$sha/check-runs?per_page=1" --jq '.total_count')"
              actual="$(jq length "$root/candidate-$idx-$stage.json")"
              test "$actual" -eq "$expected"
              jq -e --arg sha "$sha" 'all(.[]; .headSha==$sha)' \
                "$root/candidate-$idx-$stage.json" >/dev/null
            done
            processed=$((processed+1))
          done < "$root/candidates.tsv"
          test "$processed" -eq 4
          rm -f "$root/check-"*.jsonl "$root/candidates.tsv" "$root/pinned-pr.json"
      - name: Seal original upstream CI metadata as NOT a causal test oracle
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/c2-upstream-native-ci"
          node scripts/c2-upstream-original-ci-receipts.cjs \
            "$GITHUB_WORKSPACE/docs/quality/C2-FOUR-EXTERNAL-PROSPECTIVE-PR-METADATA-20261022.json" \
            "$root" "$root/output/upstream-native-ci-unscored.json"
          jq -e '.candidates==4 and
             .ciChecksSufficientForTruth==false and
             .causesOriginalBehaviorVerified==0 and
             .genuineDefectsVerified==0 and
             .independentBenignVerified==0 and
             .originalOraclesAttested==0 and
             .trainingSeparationAttested==false and
             .baselineAuthenticated==false and
             .candidatePredictionsRead==false and
             .truthSealed==false and .holdoutFrozen==false and
             .newGoldLabels==0 and .precision==null and
             .recall==null and .f1==null and .falsePositiveRate==null and
             .sssPlusCertified==false' "$root/output/upstream-native-ci-unscored.json" >/dev/null
          rm -f "$root/candidate-"*.json
          echo 'UPSTREAM_CHECKS_OBSERVED_NOT_EXECUTABLE_ORIGINAL_BEHAVIOR_PROOF'
      - name: Archive sanitized external CI receipt - no candidate source or labels
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c2-upstream-check-runs-unscored-not-oracles
          path: ${{ runner.temp }}/c2-upstream-native-ci/output/upstream-native-ci-unscored.json
          retention-days: 30
          if-no-files-found: warn
