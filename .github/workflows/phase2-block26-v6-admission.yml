name: Ultra Sentinel — v6 blind compilation and JVM ABI admission
on:
  pull_request:
    paths:
      - packages/quality-gates/jvm-abi-admission.cjs
      - scripts/phase2-kotlin-api-v6-preflight.cjs
      - tests/unit/jvm-abi-admission.test.cjs
      - tests/fixtures/jvm-abi-admission/**
      - .github/workflows/phase2-block26-v6-admission.yml
permissions:
  contents: read
jobs:
  blind-abi-preflight:
    if: github.event.repository.id == 1418338512 && github.event.pull_request.head.repo.full_name == 'cardenaspiero255-lang/Ultra-Sentinel' && github.event.pull_request.user.id == 322222186
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact host without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pin Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Pin JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Checkout unchanged frozen v6 engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0aba994cd371651d605985b659c4b32e5c3f2b15
          path: frozen-v6-engine
          persist-credentials: false
      - name: Checkout reserved original cohort 1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: jumaallan/kotlin-data-structures-algorithms
          ref: 1abc7bc2087e50318e8abb35c6ef2f9d5ad00d38
          path: originals/source-1
          persist-credentials: false
      - name: Checkout reserved original cohort 2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: qwertukg/Barnes-Hut-N-Body
          ref: 6ee77fc861d7bbdd0f73ce5796f9f10d4d8dee17
          path: originals/source-2
          persist-credentials: false
      - name: Checkout reserved original cohort 3
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Ahmed-Saber-25/grokking_algorithms
          ref: db06014f811890e97abbdedf22ff6b565e4a3c59
          path: originals/source-3
          persist-credentials: false
      - name: Checkout reserved original cohort 4
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Louiixx-h/algorithms-and-data-structure
          ref: 5f81f04de2227b725cbe002af975fefa803d3f87
          path: originals/source-4
          persist-credentials: false
      - name: Checkout reserved original cohort 5
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: parniyan7/BubbleSortAlgorithmWithKotlin
          ref: 045b7bf6eeee434995b2a3fe9013e4c1564327b7
          path: originals/source-5
          persist-credentials: false
      - name: Checkout reserved original cohort 6
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: parniyan7/QuickSortAlgorithmWithKotlin
          ref: 71ffc18f7c79fe710dc51ba4b58b07e3e81cad74
          path: originals/source-6
          persist-credentials: false
      - name: Require complete regression suite
        run: npm run check
      - name: Require 90 percent line and branch coverage of ABI decisions
        run: >-
          node --experimental-test-coverage
          --test-coverage-include=packages/quality-gates/jvm-abi-admission.cjs
          --test-coverage-lines=90 --test-coverage-branches=90
          --test tests/unit/jvm-abi-admission.test.cjs
      - name: Require Bubblewrap, AppArmor and actual cgroup isolation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -qq bubblewrap apparmor apparmor-utils apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile" && test ! -L "$profile"
          sudo install -o root -g root -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          SENTINEL_JVM_V2_RUNNER=1 SENTINEL_REQUIRE_BLIND_BWRAP=1 node --test tests/unit/generic-jvm-metamorphic-isolation.test.cjs
      - name: Fetch SHA256-pinned Kotlin 2.0.21 compiler
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kotlin-compiler-2.0.21.zip"
          gh api -H 'Accept: application/octet-stream' /repos/JetBrains/kotlin/releases/assets/198150667 > "$archive"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = 0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a
          mkdir "$RUNNER_TEMP/kotlin-v6"
          unzip -q "$archive" -d "$RUNNER_TEMP/kotlin-v6"
      - name: Compile actual Kotlin facade, arrays, object and companions without invoking them
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/abi-kotlin-compiled"
          bash frozen-v6-engine/tests/fixtures/phase2-block26-object-contracts/run-isolated.sh compile-v2 "$RUNNER_TEMP/kotlin-v6/kotlinc" "$GITHUB_WORKSPACE/tests/fixtures/jvm-abi-admission" "$RUNNER_TEMP/abi-kotlin-compiled"
          node scripts/phase2-kotlin-api-v6-preflight.cjs inspect "$RUNNER_TEMP/abi-kotlin-compiled/target.jar" "$RUNNER_TEMP/abi-development.json"
          node - "$RUNNER_TEMP/abi-development.json" <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const data=JSON.parse(fs.readFileSync(process.argv[2]));
          const admitted=data.callables.filter(x=>x.reason==='ADMISSIBLE_ABI_CANDIDATE');
          assert.equal(admitted.length,6);
          for(const receiver of ['STATIC','OBJECT','COMPANION'])assert.ok(admitted.some(x=>x.receiver===receiver));
          assert.ok(admitted.some(x=>x.className==='sample.admission.NamedFacade'));
          assert.ok(admitted.every(x=>x.targetInvoked===false));
          console.log('ACTUAL_KOTLIN_ABI_ONLY_ADMISSION_PASSED');
          JS
      - name: Compile 37 original sources and read ABI only before oracles or Hunter
        shell: bash
        run: |
          set -euo pipefail
          node scripts/phase2-kotlin-api-v6-preflight.cjs docs/quality/PHASE2-BLOCK26-V6-RESERVATION.json "$GITHUB_WORKSPACE/frozen-v6-engine" "$GITHUB_WORKSPACE/originals" "$RUNNER_TEMP/kotlin-v6/kotlinc" "$RUNNER_TEMP/v6-abi-work" "$RUNNER_TEMP/v6-abi-admission"
          cat "$RUNNER_TEMP/v6-abi-admission/admission.json"
          cat "$RUNNER_TEMP/v6-abi-admission/admission-seal.json"
      - name: Publish immutable ABI admission and original compilation diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: block26-v6-blind-abi-admission
          path: |
            ${{ runner.temp }}/v6-abi-admission/
            ${{ runner.temp }}/abi-development.json
          retention-days: 90
          if-no-files-found: error
