name: Ultra Sentinel — C2 Kotlin 106 isolated reproduction campaign
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke = 2 tasks; full = all 106 original tasks (resource intensive)'
        type: choice
        options: [smoke, full]
        required: true
        default: smoke
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: ultra-sentinel-c2-kotlin-upstream-campaign
  cancel-in-progress: false
jobs:
  roster:
    if: >-
      github.event.repository.id == 1418338512 &&
      github.actor_id == '322222186' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch') ||
       (github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.issue.number == 50 &&
        github.event.issue.pull_request == null &&
        (github.event.comment.body == 'ULTRA_SENTINEL_C2_KOTLIN_106_SMOKE_V1' ||
         github.event.comment.body == 'ULTRA_SENTINEL_C2_KOTLIN_106_FULL_V1') &&
        github.event.comment.user.id == 322222186 &&
        github.event.sender.id == 322222186))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: sentinel
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Kotlin/kotlin-swe-bench
          ref: b9025d86f7ae634901396766bd61f6d4ae6d2165
          path: upstream
          persist-credentials: false
      - id: plan
        shell: bash
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.comment.body == 'ULTRA_SENTINEL_C2_KOTLIN_106_FULL_V1' && 'full' || 'smoke') }}
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = b9025d86f7ae634901396766bd61f6d4ae6d2165
          python3 -m unittest discover -s sentinel/tests/unit -p 'test_c2_bulk_kotlin_campaign.py' -v
          matrix=$(python3 sentinel/scripts/c2-bulk-kotlin-campaign.py plan --upstream "$GITHUB_WORKSPACE/upstream" --mode "$MODE")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  reproduce:
    needs: roster
    if: needs.roster.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.roster.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: sentinel
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Kotlin/kotlin-swe-bench
          ref: b9025d86f7ae634901396766bd61f6d4ae6d2165
          path: upstream
          persist-credentials: false
      - name: Run original source BEFORE and AFTER in isolated networkless containers
        env:
          TASKS_JSON: ${{ toJSON(matrix.tasks) }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = b9025d86f7ae634901396766bd61f6d4ae6d2165
          python3 sentinel/scripts/c2-bulk-kotlin-campaign.py run-shard \
            --upstream "$GITHUB_WORKSPACE/upstream" --tasks-json "$TASKS_JSON" \
            --output "$RUNNER_TEMP/c2-results"
      - name: Upload original candidate-only SHA-anchored evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: c2-kotlin-batch-${{ matrix.id }}
          path: ${{ runner.temp }}/c2-results
          retention-days: 7
          if-no-files-found: warn
  summarize:
    needs: [roster, reproduce]
    if: always() && needs.roster.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: sentinel
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Kotlin/kotlin-swe-bench
          ref: b9025d86f7ae634901396766bd61f6d4ae6d2165
          path: upstream
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: c2-kotlin-batch-*
          path: ${{ runner.temp }}/c2-received
          merge-multiple: false
      - name: Produce fail-closed aggregate, zero labels until source review
        shell: bash
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.comment.body == 'ULTRA_SENTINEL_C2_KOTLIN_106_FULL_V1' && 'full' || 'smoke') }}
        run: |
          set -euo pipefail
          python3 sentinel/scripts/c2-bulk-kotlin-campaign.py aggregate \
            --upstream "$GITHUB_WORKSPACE/upstream" \
            --receipts "$RUNNER_TEMP/c2-received" \
            --mode "$MODE" \
            --output "$RUNNER_TEMP/c2-kotlin-campaign-report.json"
      - name: Set up Node 22 for deterministic candidate-only review
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Apply four required gates, fail closed on missing or invented candidates
        shell: bash
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.comment.body == 'ULTRA_SENTINEL_C2_KOTLIN_106_FULL_V1' && 'full' || 'smoke') }}
        run: |
          set -euo pipefail
          node sentinel/scripts/c2-review-kotlin-candidates.cjs \
            --receipts "$RUNNER_TEMP/c2-received" \
            --mode "$MODE" \
            --output "$RUNNER_TEMP/c2-four-gate-review.json"
          jq -e '.admitted == 0 and .newLabels == 0 and
            .originalBehaviorAttestations == 0 and
            .independentlyVerifiedRootCauses == 0 and
            .detectorRulesValidated == 0 and
            .historicalFingerprintsCompared == 0 and
            .tripleSPlusCertified == false and .blindHoldout == false and
            (.receiptsSeen + .missing == 106)' \
            "$RUNNER_TEMP/c2-four-gate-review.json" >/dev/null
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: c2-kotlin-four-gate-review
          path: ${{ runner.temp }}/c2-four-gate-review.json
          retention-days: 14
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: c2-kotlin-campaign-aggregate
          path: ${{ runner.temp }}/c2-kotlin-campaign-report.json
          retention-days: 14
          if-no-files-found: warn
