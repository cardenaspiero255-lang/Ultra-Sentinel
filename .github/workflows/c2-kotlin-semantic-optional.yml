name: Ultra Sentinel — C2 optional Kotlin semantic compiler and real Gradle DSL
on:
  pull_request:
    paths:
      - .github/workflows/c2-kotlin-semantic-optional.yml
      - tests/fixtures/c2-kotlin-semantic/**
      - packages/kotlin-semantic/**
      - tests/fixtures/c2-gradle-kotlin-dsl/**
      - tests/unit/c2-kotlin-optional-semantic-executable.test.cjs
      - scripts/c2-kotlin-semantic-evidence.py
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: c2-kotlin-semantic-optional-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  verify-real-kotlin-compiler:
    if: >-
      github.event.repository.id == 1418338512 &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'cardenaspiero255-lang/Ultra-Sentinel' &&
        github.event.pull_request.head.ref == 'feat/c2-kotlin-optional-symbol-gradle-dsl-resolver-20261020') ||
       (github.ref == 'refs/heads/main' &&
        ((github.event_name == 'workflow_dispatch' && github.actor_id == '322222186') ||
         (github.event_name == 'issue_comment' &&
          github.event.action == 'created' &&
          github.event.issue.number == 50 &&
          github.event.issue.pull_request == null &&
          github.event.comment.body == 'ULTRA_SENTINEL_C2_KOTLIN_SEMANTIC_V1' &&
          github.actor_id == '322222186' &&
          github.event.comment.user.id == 322222186 &&
          github.event.sender.id == 322222186))))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: sentinel
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: detekt/detekt
          ref: 5d9ee0d6d61e7b59d798c99611e48e4105681624
          path: upstream
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # pinned action
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify original Kotlin toolchain and immutable original Detekt SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = 5d9ee0d6d61e7b59d798c99611e48e4105681624
          test "$(git -C upstream hash-object detekt-rules-exceptions/src/main/kotlin/io/gitlab/arturbosch/detekt/rules/exceptions/ThrowingExceptionsWithoutMessageOrCause.kt)" = 7d6ba408db3764568204e2c689aff260d8ffc3f7
          grep -Fqx 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-all.zip' upstream/gradle/wrapper/gradle-wrapper.properties
          test -f upstream/gradlew
          test -f sentinel/tests/fixtures/c2-kotlin-semantic/C2SymbolResolutionOracleTest.kt
          test -f sentinel/packages/kotlin-semantic/C2OptionalKotlinSemantic.kt
          test -f sentinel/tests/fixtures/c2-gradle-kotlin-dsl/build.gradle.kts
          test -f sentinel/tests/fixtures/c2-gradle-kotlin-dsl/settings.gradle.kts
      - name: Compile and run actual Kotlin compiler BindingContext symbol test
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Xmx3g
        run: |
          set -euo pipefail
          dest=upstream/detekt-rules-exceptions/src/test/kotlin/io/gitlab/arturbosch/detekt/rules/exceptions
          test -d "$dest"
          test ! -e "$dest/C2SymbolResolutionOracleTest.kt"
          cp sentinel/tests/fixtures/c2-kotlin-semantic/C2SymbolResolutionOracleTest.kt "$dest/"
          cp sentinel/packages/kotlin-semantic/C2OptionalKotlinSemantic.kt "$dest/"
          cd upstream
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --max-workers=2 \
            :detekt-rules-exceptions:test \
            --tests io.gitlab.arturbosch.detekt.rules.exceptions.C2SymbolResolutionOracleTest
      - name: Execute actual Gradle 8.10.2 Kotlin DSL assignment plugin, plus traditional setter control
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Xmx3g
        run: |
          set -euo pipefail
          upstream/gradlew -p "$GITHUB_WORKSPACE/sentinel/tests/fixtures/c2-gradle-kotlin-dsl" \
            --no-daemon --no-configuration-cache --max-workers=2 \
            c2DslAssignment c2SetterControl
      - name: Attest JUnit and real Gradle DSL outputs; never mint labels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c2-kotlin-semantic"
          original="upstream/detekt-rules-exceptions/build/test-results/test/TEST-io.gitlab.arturbosch.detekt.rules.exceptions.C2SymbolResolutionOracleTest.xml"
          test -s "$original"
          cp "$original" "$RUNNER_TEMP/c2-kotlin-semantic/original-junit.xml"
          python3 sentinel/scripts/c2-kotlin-semantic-evidence.py \
            --upstream upstream \
            --xml "$original" \
            --gradle-output sentinel/tests/fixtures/c2-gradle-kotlin-dsl/build/c2-kotlin-semantic \
            --fixtures sentinel \
            --output "$RUNNER_TEMP/c2-kotlin-semantic/semantic-evidence.json"
          jq -e '.originalJunitTestsPassed == 7 and
            .gradleDslCompilerPluginExecuted == true and
            .kotlinSymbolResolutionExecuted == true and
            .newLabels == 0 and .admittedLabels == 0 and
            .optInRequired == true and .experimental == true and
            .sentinelRuleCoverageVerified == false and
            .blindHoldout == false and .sssPlusCertified == false and
            .precision == null and .recall == null and .f1 == null' \
            "$RUNNER_TEMP/c2-kotlin-semantic/semantic-evidence.json" >/dev/null
          cp sentinel/tests/fixtures/c2-gradle-kotlin-dsl/build/c2-kotlin-semantic/*.txt "$RUNNER_TEMP/c2-kotlin-semantic/"
      - name: Publish original Kotlin/Gradle semantic evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: c2-kotlin-optional-semantic-proof
          path: ${{ runner.temp }}/c2-kotlin-semantic
          retention-days: 14
          if-no-files-found: warn
