name: Ultra Sentinel — retire pinned obsolete Kotlin 62 retry (one-shot)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c2-kotlin-62-retire-stale-run.yml'
jobs:
  archive:
    if: github.repository_id == 1418338512 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify pinned stale run and preserve original metadata and failed-job logs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/c2-retirement"
          mkdir -p "$dir"
          repo="$GITHUB_REPOSITORY"
          gh api "/repos/$repo/actions/runs/39205355612" > "$dir/original-run.json"
          jq -e '.id == 39205355612 and
            .head_sha == "533d0e0350bf3f75fcc4cc9426cef6039bf6baf1" and
            .repository.id == 1418338512 and
            .actor.login == "cardenaspiero255-lang" and
            .name == "Ultra Sentinel — C2 Kotlin 62 bounded original-source retries"'             "$dir/original-run.json" >/dev/null
          gh api "/repos/$repo/actions/runs/39205355612/jobs?per_page=100" > "$dir/original-jobs.json"
          jq -e '.total_count == 14 and
            ([.jobs[] | select(.id == 117906928510 or .id == 117906928544) |
              select(.conclusion == "failure")] | length == 2)' "$dir/original-jobs.json" >/dev/null
          gh api "/repos/$repo/actions/runs/39205355612/artifacts?per_page=100" > "$dir/original-artifacts.json"
          # No original artifacts existed when the remediation was authorized.
          # If new artifacts become available, stop rather than risk unarchived loss.
          jq -e '.total_count == 0' "$dir/original-artifacts.json" >/dev/null
          for id in 117906928510 117906928544; do
            gh api "/repos/$repo/actions/jobs/$id/logs" > "$dir/failed-job-$id.log"
            test -s "$dir/failed-job-$id.log"
            grep -q 'EACCES: permission denied' "$dir/failed-job-$id.log"
          done
          (
            cd "$dir"
            sha256sum original-run.json original-jobs.json original-artifacts.json failed-job-*.log > sha256sums.txt
          )
      - name: Archive before any cancellation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: c2-retired-39205355612-evidence
          path: ${{ runner.temp }}/c2-retirement
          retention-days: 90
          if-no-files-found: error
  retire:
    needs: archive
    if: needs.archive.result == 'success' && github.repository_id == 1418338512 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel only the original run after verified archival
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          current="$(gh api "/repos/$repo/actions/runs/39205355612")"
          jq -e '.id == 39205355612 and
            .head_sha == "533d0e0350bf3f75fcc4cc9426cef6039bf6baf1" and
            .repository.id == 1418338512 and
            .actor.login == "cardenaspiero255-lang"' <<< "$current" >/dev/null
          status="$(jq -r '.status' <<< "$current")"
          if [[ "$status" == completed ]]; then
            echo "C2_OLD_RUN_ALREADY_COMPLETED=true"
            exit 0
          fi
          gh api -X POST "/repos/$repo/actions/runs/39205355612/cancel" >/dev/null
          echo "C2_OLD_RUN_CANCEL_REQUEST_ACCEPTED=true"
