name: Ultra Sentinel — real GameHub C2 capture (read-only)
# Proprietary opt-in diagnostic only. Source diffs are never uploaded.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ultra-sentinel-c2-owner-snapshot-main
  cancel-in-progress: false

jobs:
  capture-c2:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.repository.id == 1418338512 &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.issue.number == 50 &&
        github.event.issue.pull_request == null &&
        github.event.comment.body == 'ULTRA_SENTINEL_C2_CAPTURE_V1' &&
        github.event.comment.user.id == 322222186 &&
        github.event.sender.id == 322222186))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Trusted main checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check snapshot program and security contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = main
          npm run check
      - name: Collect four current PR samples without source, secrets or approvals
        id: c2
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/capture-live-gamehub-c2.cjs > "$RUNNER_TEMP/c2-candidate.json"
          result=$?
          set -e
          if [ "$result" = 0 ] || [ "$result" = 2 ]; then
            echo "report_valid=true" >> "$GITHUB_OUTPUT"
          fi
          echo "C2 candidate-only status code: $result"
          exit "$result"
      - name: Publish public, sanitized, candidate-only report even when incomplete
        if: ${{ always() && steps.c2.outputs.report_valid == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: ultra-sentinel-c2-sanitized-candidates
          path: ${{ runner.temp }}/c2-candidate.json
          retention-days: 7
          if-no-files-found: error
