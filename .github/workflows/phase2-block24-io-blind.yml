name: Ultra Sentinel — Phase 2 Block 2.4 frozen v2 new Kotlin IO blind
on:
  pull_request:
    paths:
      - scripts/phase2-block24-blind-eval.cjs
      - tests/unit/phase2-block24-blind-eval.test.cjs
      - docs/quality/PHASE2-BLOCK24-IO-BLIND-VERDICT.md
      - .github/workflows/phase2-block24-io-blind.yml
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frozen-v2-source-only-capture:
    if: >-
      github.event.repository.id == 1418338512 &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'cardenaspiero255-lang/Ultra-Sentinel' &&
        github.event.pull_request.user.id == 322222186) ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/main' && github.actor_id == '322222186'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate protocol SHA without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run full architecture and TDD regression suite
        run: npm run check
      - name: Checkout immutable v2 Hunter only, never the modified protocol engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cardenaspiero255-lang/Ultra-Sentinel
          ref: 34679a71aed54abbc3ecbffbf29299cfb25f65b8
          path: frozen-engine-v2
          persist-credentials: false
      - name: Checkout committed original Kotlin IO cohort
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kotlin/kotlinx-io
          ref: cf40e5ba7cd99ba812177d597a9f6ce0570545b1
          path: reserved-io
          persist-credentials: false
      - name: Enforce Bubblewrap and AppArmor isolation; block if unavailable
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -qq bubblewrap apparmor apparmor-utils apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile" && test ! -L "$profile"
          sudo install -o root -g root -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Prove real no-network isolated source workers on the v2 SHA
        run: |
          SENTINEL_REQUIRE_BLIND_BWRAP=1 node --test frozen-engine-v2/tests/unit/phase2-blind-isolation-boundary.test.cjs
          SENTINEL_REQUIRE_BLIND_BWRAP=1 node --test frozen-engine-v2/tests/unit/phase2-blind-numeric-isolation.test.cjs
      - name: Authenticate full six-file original source cohort and prepare source-only inventory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node scripts/phase2-block24-blind-eval.cjs prepare \
            "$GITHUB_WORKSPACE/frozen-engine-v2" "$GITHUB_WORKSPACE/reserved-io" \
            "$RUNNER_TEMP/block24-blind-input"
      - name: Execute original frozen v2 numeric, codec and identity workers WITHOUT oracle mounts
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          engine="$GITHUB_WORKSPACE/frozen-engine-v2"
          helper="$engine/packages/investigation/plain-kotlin-payload.cjs"
          policy="$engine/packages/investigation/novel-kotlin-path-policy.cjs"
          output="$RUNNER_TEMP/block24-worker-out"
          mkdir -m 700 "$output"
          mkdir -m 700 "$output/numeric" "$output/codec" "$output/identity"
          bash "$engine/tests/fixtures/gamehub-blind-numeric/run-hunter.sh" \
            "$RUNNER_TEMP/block24-blind-input/numeric.json" \
            "$engine/packages/family-hunter/phase2-numeric-risk-hunter.cjs" \
            "$engine/packages/family-hunter/blind-numeric-worker.cjs" \
            "$helper" "$policy" "$output/numeric"
          bash "$engine/tests/fixtures/gamehub-codec/run-blind-codec-hunter.sh" \
            "$RUNNER_TEMP/block24-blind-input/codec.json" \
            "$engine/packages/family-hunter/phase2-codec-integrity-hunter.cjs" \
            "$engine/packages/family-hunter/phase2-blind-codec-worker.cjs" \
            "$helper" "$policy" "$output/codec"
          bash "$engine/tests/fixtures/gamehub-identity/run-blind-identity-hunter.sh" \
            "$RUNNER_TEMP/block24-blind-input/codec.json" \
            "$engine/packages/family-hunter/phase2-identity-delimiter-hunter.cjs" \
            "$engine/packages/family-hunter/phase2-blind-identity-worker.cjs" \
            "$helper" "$policy" "$output/identity"
          node scripts/phase2-block24-blind-eval.cjs seal "$output" "$RUNNER_TEMP/block24-predictions-sealed"
          node scripts/phase2-block24-blind-eval.cjs verify "$RUNNER_TEMP/block24-predictions-sealed"
          jq -e '.sourceFiles==6 and .legacyPathsSupported==6 and
            .workerCount==3 and .scored==false and
            .oracleExecutedBeforeSeal==false and
            .precision==null and .recall==null and .f1==null and
            .novelFamilyVerified==false and .remoteWrites==false' \
            "$RUNNER_TEMP/block24-predictions-sealed/prediction-seal.json" >/dev/null
      - name: Upload sealed predictions BEFORE independent Kotlin oracles
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: phase2-block24-io-source-only-v2-predictions-sealed-before-oracle
          path: ${{ runner.temp }}/block24-predictions-sealed/
          if-no-files-found: error
          retention-days: 30
  independent-kotlin-oracles-after-seal:
    needs: frozen-v2-source-only-capture
    if: >-
      needs.frozen-v2-source-only-capture.result == 'success' &&
      github.event.repository.id == 1418338512
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout same exact protocol SHA without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Download only prediction artifact uploaded by the completed blind job
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: phase2-block24-io-source-only-v2-predictions-sealed-before-oracle
          path: ${{ runner.temp }}/block24-consumed-seal
      - name: Independently verify all three original worker report digests before oracle execution
        run: |
          node scripts/phase2-block24-blind-eval.cjs verify "$RUNNER_TEMP/block24-consumed-seal"
      - name: Checkout exact immutable Hunter v2 for postseal source authentication
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cardenaspiero255-lang/Ultra-Sentinel
          ref: 34679a71aed54abbc3ecbffbf29299cfb25f65b8
          path: frozen-engine-v2
          persist-credentials: false
      - name: Checkout previously reserved original Kotlin IO at exact SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kotlin/kotlinx-io
          ref: cf40e5ba7cd99ba812177d597a9f6ce0570545b1
          path: reserved-io
          persist-credentials: false
      - name: Verify precommitted SHA256 oracles and all original Git blobs after sealing
        run: |
          node scripts/phase2-block24-preflight.cjs \
            "$GITHUB_WORKSPACE/frozen-engine-v2" "$GITHUB_WORKSPACE/reserved-io" \
            "$RUNNER_TEMP/block24-reauthenticated-originals.json"
      - name: JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Enforce isolated Bubblewrap and AppArmor for both independent Kotlin oracles
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -qq bubblewrap apparmor apparmor-utils apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile" && test ! -L "$profile"
          sudo install -o root -g root -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Download and byte-verify Kotlin 2.0.21 toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/kotlin-2.0.21.zip"
          gh api -H 'Accept: application/octet-stream' /repos/JetBrains/kotlin/releases/assets/198150667 > "$zip"
          test "$(sha256sum "$zip" | cut -d' ' -f1)" = 0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a
          mkdir "$RUNNER_TEMP/block24-kotlin"
          unzip -q "$zip" -d "$RUNNER_TEMP/block24-kotlin"
      - name: Execute two independently precommitted bounded JVM oracles after the seal
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          jdk="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          mounts=(--ro-bind /usr /usr)
          for mount in /bin /lib /lib64; do
            if [ -L "$mount" ]; then
              target="$(readlink "$mount")"
              [[ "$target" != /* && "$target" != *..* ]] || exit 2
              mounts+=(--symlink "$target" "$mount")
            elif [ -d "$mount" ]; then mounts+=(--ro-bind "$mount" "$mount")
            else exit 2; fi
          done
          mkdir -m 700 "$RUNNER_TEMP/block24-compiled"
          mkdir -m 700 "$RUNNER_TEMP/block24-oracle-logs"
          common=(--die-with-parent --unshare-all --new-session --clearenv
            --setenv PATH /kotlin/bin:/jdk/bin:/usr/bin:/bin
            --setenv JAVA_HOME /jdk --setenv HOME /tmp
            "${mounts[@]}" --ro-bind "$jdk" /jdk
            --ro-bind "$RUNNER_TEMP/block24-kotlin/kotlinc" /kotlin
            --ro-bind "$GITHUB_WORKSPACE/reserved-io" /source
            --ro-bind "$GITHUB_WORKSPACE/tests/fixtures/phase2-block24-oracle" /oracle
            --bind "$RUNNER_TEMP/block24-compiled" /out
            --tmpfs /tmp --proc /proc --dev /dev --dir /home --chdir /tmp)
          timeout --kill-after=3s 180s env -i PATH=/usr/bin:/bin HOME=/tmp /usr/bin/bwrap "${common[@]}" -- \
            /kotlin/bin/kotlinc -jvm-target 17 -include-runtime \
            /source/bytestring/common/src/ByteStringBuilder.kt \
            /oracle/ByteStringStub.kt /oracle/BuilderOracle.kt -d /out/builder-original.jar
          timeout --kill-after=3s 180s env -i PATH=/usr/bin:/bin HOME=/tmp /usr/bin/bwrap "${common[@]}" -- \
            /kotlin/bin/kotlinc -jvm-target 17 -include-runtime \
            /source/bytestring/common/src/Random.kt \
            /oracle/ByteStringStub.kt /oracle/UnsafeByteStringStub.kt \
            /oracle/RandomOracle.kt -d /out/random-original.jar
          for id in builder random; do
            timeout --kill-after=3s 60s env -i PATH=/usr/bin:/bin HOME=/tmp /usr/bin/bwrap \
              --die-with-parent --unshare-all --new-session --clearenv \
              --setenv PATH /jdk/bin:/usr/bin:/bin --setenv HOME /tmp \
              "${mounts[@]}" --ro-bind "$jdk" /jdk \
              --ro-bind "$RUNNER_TEMP/block24-compiled" /jars \
              --tmpfs /tmp --proc /proc --dev /dev --dir /home --chdir /tmp -- \
              /jdk/bin/java -jar "/jars/$id-original.jar" > "$RUNNER_TEMP/block24-oracle-logs/$id.log"
          done
          node scripts/phase2-block24-blind-eval.cjs verdict \
            "$RUNNER_TEMP/block24-consumed-seal" "$RUNNER_TEMP/block24-oracle-logs" \
            "$GITHUB_WORKSPACE/frozen-engine-v2" "$GITHUB_WORKSPACE/reserved-io" \
            "$RUNNER_TEMP/block24-original-oracle-verdict.json"
          jq -e '.originalKotlinSourcesScanned==6 and .unsupportedSourceCount==0 and
            .scopedBenignControlsPassed==2 and .fullyLabeledOriginalFiles==0 and
            .originalPositiveDefectsVerified==false and .novelFamilyVerified==false and
            .precision==null and .recall==null and .f1==null and .remoteWrites==false' \
            "$RUNNER_TEMP/block24-original-oracle-verdict.json" >/dev/null
      - name: Publish independent original JVM oracle verdict separate from blind predictions
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: phase2-block24-io-original-jvm-scoped-verdict-after-seal
          path: ${{ runner.temp }}/block24-original-oracle-verdict.json
          if-no-files-found: warn
          retention-days: 30
