name: C2 independent source-only executable Tasks original JVM and causal control
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/c2-external-tasks-original-worker.yml
      - packages/quality-gates/c2-external-tasks-throttle.cjs
      - packages/quality-gates/c2-tasks-source-only-observation.cjs
      - scripts/c2-tasks-source-only-receipt.cjs
      - tests/unit/c2-tasks-source-only-observation.test.cjs
      - tests/oracles/c2-external-tasks-throttle/**
      - tests/unit/c2-external-tasks-throttle.test.cjs
permissions:
  contents: read
concurrency:
  group: c2-external-tasks-worker-${{ github.sha }}
  cancel-in-progress: false
jobs:
  actual-external-worker-rule-review:
    if: >-
      github.event.repository.id == 1418338512 &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'cardenaspiero255-lang'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout immutable owner-main Sentinel only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout immutable public Tasks.org source (no credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tasks/tasks
          ref: 3936c221aea180b795085d7402286373b5d3f6d2
          fetch-depth: 0
          path: original-external
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Setup pinned JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify original Git identities, code, ancestry and Kotlin toolchain
        shell: bash
        run: |
          set -euo pipefail
          git -C original-external rev-parse HEAD | grep -Fx 3936c221aea180b795085d7402286373b5d3f6d2
          git -C original-external merge-base --is-ancestor 5624816cac6ecab701969d24e6d3387ccd21a773 3936c221aea180b795085d7402286373b5d3f6d2
          git -C original-external rev-parse HEAD:app/src/main/java/org/tasks/notifications/Throttle.kt | grep -Fx 0e472cfd73510ab11a396ee5eba9968d57172050
          test -x "$(command -v kotlinc)"
          root="$RUNNER_TEMP/c2-external-tasks"
          mkdir -p "$root"
          kotlinc original-external/app/src/main/java/org/tasks/notifications/Throttle.kt \
            tests/oracles/c2-external-tasks-throttle/*.kt \
            -include-runtime -d "$root/original-tasks.jar"
          test -s "$root/original-tasks.jar"
      - name: Execute genuine original Tasks.org worker source inside isolated JVM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -qq bubblewrap apparmor apparmor-utils apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile" && test ! -L "$profile"
          sudo install -o root -g root -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          root="$RUNNER_TEMP/c2-external-tasks"
          jdk="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          test -x "$jdk/bin/java" && test -x /usr/bin/bwrap
          mounts=(--ro-bind /usr /usr)
          for mount in /bin /lib /lib64; do
            if [ -L "$mount" ]; then
              target="$(readlink "$mount")"
              [[ "$target" != /* && "$target" != *..* ]] || exit 2
              mounts+=(--symlink "$target" "$mount")
            elif [ -d "$mount" ]; then
              mounts+=(--ro-bind "$mount" "$mount")
            else
              exit 2
            fi
          done
          env -i PATH=/usr/bin:/bin HOME=/tmp \
            /usr/bin/bwrap --die-with-parent --unshare-all --new-session --clearenv \
              --setenv PATH /usr/bin:/bin --setenv HOME /tmp \
              "${mounts[@]}" --ro-bind "$jdk" /jdk --ro-bind "$root" /workspace \
              --proc /proc --dev /dev --tmpfs /tmp --dir /home --chdir /workspace \
              -- /jdk/bin/java -jar /workspace/original-tasks.jar > "$root/worker.json"
          jq -e '
            .schema=="c2-tasks-throttle-external-jvm/v1" and
            .productionSourceExecuted==true and .executorThreadIsNotCaller==true and
            .callerReturnedBeforeWorkerCompletion==true and
            .secondCallbackOnExecutorThread==true and
            .defaultSleeperElapsedMillis>=100 and
            .allTasksComplete==true and
            .counterfactualSameOriginalProductionSource==true and
            .counterfactualExecutedOnCaller==true and
            .counterfactualCompletedSynchronously==true and
            .independentOriginalTruth==false
          ' "$root/worker.json" >/dev/null
      - name: Seal source-only original versus counterfactual runtime receipt - no Core
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/c2-external-tasks"
          node scripts/c2-tasks-source-only-receipt.cjs \
            "$GITHUB_WORKSPACE/original-external" "$root/worker.json" "$root/report.json"
          jq -e '
            .schema=="c2-source-only-executable-original-vs-control/v1" and
            .status=="ORIGINAL_SOURCE_RUNTIME_DEVELOPMENT_CONTROL_ONLY" and
            .originalHeadSha=="3936c221aea180b795085d7402286373b5d3f6d2" and
            .originalSourceGitBlob=="0e472cfd73510ab11a396ee5eba9968d57172050" and
            .originalWorkerAsynchronous==true and
            .controlledInlineSynchronous==true and
            .sourceRepository=="tasks/tasks" and
            .originalSourceVerifiedByGitInThisProcess==true and
            .independentProspectiveTruthAttested==false and
            .candidatePredictionsRead==false and
            .newGoldLabels==0 and .truthSealed==false and
            .holdoutFrozen==false and .precision==null and
            .sssPlusCertified==false
          ' "$root/report.json" >/dev/null
          mkdir -p "$root/output"
          cp "$root/worker.json" "$root/report.json" "$root/output/"
          rm -f "$root/worker.json" "$root/report.json" "$root/original-tasks.jar"
      - name: Archive metadata only, not third-party source or executable
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c2-tasks-source-only-original-inline-counterfactual-development
          path: ${{ runner.temp }}/c2-external-tasks/output
          retention-days: 14
          if-no-files-found: warn
