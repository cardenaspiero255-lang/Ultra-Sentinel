name: Ultra Sentinel — Aprobación GitHub remota JARVIS #105 (sin Termux)
# GitHub-authenticated owner approval. No source edits or remote writes.
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  id-token: write
concurrency:
  group: ultra-owner-remote-jarvis-single-approval
  cancel-in-progress: false
jobs:
  verify-owner-remote-approval:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.repository.id == 1418338512 &&
      github.actor == 'cardenaspiero255-lang' &&
      github.actor_id == '322222186' &&
      github.event.sender.id == 322222186 &&
      github.event.comment.user.id == 322222186 &&
      github.event.issue.number == 50 &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, 'ULTRA_SENTINEL_REMOTE_APPROVAL_V1|') &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout protected main commit without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check exact immutable workflow source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/main
          node --test tests/unit/github-remote-owner-approval.test.cjs
      - name: Verify OIDC signature, live nonce uniqueness and exact JARVIS draft PR
        shell: bash
        env:
          ULTRA_OWNER_COMMENT_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/verify-remote-jarvis-owner-workflow.cjs
          test -s "$RUNNER_TEMP/owner-remote-approval-receipt.json"
          node - "$RUNNER_TEMP/owner-remote-approval-receipt.json" <<'NODE'
          const fs=require('node:fs');
          const data=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(data.status!=='REMOTE_OWNER_GITHUB_APPROVAL_VERIFIED'||
             data.prNumber!==105||data.githubOIDCVerified!==true||
             data.nonceReplayBlocked!==true||
             data.sourceAuthenticatedAtCheck!==true||
             data.remoteWrites!==false||data.remoteWriteExecuted!==false||
             data.rollbackAuthorized!==false||data.mergeAllowed!==false||
             data.requiresSeparateWriteExecutor!==true)process.exit(1);
          NODE
      # Optional owner-configured stage; disabled when repository variable
      # ULTRA_SENTINEL_GITHUB_REMOTE_ENABLED is not exactly 'true'.
      - name: Prepare independent original Kotlin/JVM oracle for owner-approved draft repair
        if: success() && vars.ULTRA_SENTINEL_GITHUB_REMOTE_ENABLED == 'true'
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install strict Bubblewrap and AppArmor for owner-controlled draft repair
        if: success() && vars.ULTRA_SENTINEL_GITHUB_REMOTE_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l \
            apt-get install -y -qq bubblewrap apparmor apparmor-utils apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile" && test ! -L "$profile"
          sudo install -o root -g root -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Fetch pinned Kotlin compiler binary
        if: success() && vars.ULTRA_SENTINEL_GITHUB_REMOTE_ENABLED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          compiler="$RUNNER_TEMP/kotlin-compiler-2.0.21.zip"
          gh api -H 'Accept: application/octet-stream' \
            /repos/JetBrains/kotlin/releases/assets/198150667 > "$compiler"
          test "$(sha256sum "$compiler" | cut -d' ' -f1)" = 0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a
          mkdir "$RUNNER_TEMP/jarvis-polite-kotlin"
          unzip -q "$compiler" -d "$RUNNER_TEMP/jarvis-polite-kotlin"
          test -x "$RUNNER_TEMP/jarvis-polite-kotlin/kotlinc/bin/kotlinc"
          echo "JARVIS_KOTLIN_HOME=$RUNNER_TEMP/jarvis-polite-kotlin/kotlinc" >> "$GITHUB_ENV"
      - name: Reauthenticate owner OIDC and run the pinned original JVM, Judge and optional branch commit
        if: success() && vars.ULTRA_SENTINEL_GITHUB_REMOTE_ENABLED == 'true'
        shell: bash
        env:
          ULTRA_OWNER_COMMENT_READ_TOKEN: ${{ github.token }}
          ULTRA_SENTINEL_JARVIS_OWNER_TOKEN: ${{ secrets.ULTRA_SENTINEL_JARVIS_OWNER_TOKEN }}
          ULTRA_SENTINEL_REMOTE_REPAIR_APPLY: ${{ vars.ULTRA_SENTINEL_REMOTE_DRAFT_APPLY }}
          ULTRA_SENTINEL_REMOTE_DRAFT_APPLY_CONFIRMED: ${{ vars.ULTRA_SENTINEL_REMOTE_DRAFT_APPLY_CONFIRMED }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/run-github-owner-jarvis-remote.cjs
      - name: Archive only exact draft branch recovery plan (never a token or signature)
        if: success() && vars.ULTRA_SENTINEL_GITHUB_REMOTE_ENABLED == 'true' && vars.ULTRA_SENTINEL_REMOTE_DRAFT_APPLY == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: owner-jarvis-remote-draft-repair-recovery-plan
          path: ${{ runner.temp }}/owner-remote-jarvis-rollback-plan.json
          retention-days: 7
          if-no-files-found: error
      - name: Archive bounded read-only authorization observation
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: owner-jarvis-remote-approval-no-write
          path: ${{ runner.temp }}/owner-remote-approval-receipt.json
          retention-days: 7
          if-no-files-found: error
