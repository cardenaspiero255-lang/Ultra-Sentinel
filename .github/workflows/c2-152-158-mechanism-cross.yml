name: C2 152 158 source-causal comparisons against known mechanisms
on:
  pull_request:
    paths:
      - .github/workflows/c2-152-158-mechanism-cross.yml
      - .github/workflows/c2-pr186-four-source-cross.yml
      - .github/workflows/c2-rollback-cross-owner.yml
      - .github/workflows/c2-real-causal-jvm-campaign.yml
      - packages/quality-gates/c2-152-158-mechanism-cross.cjs
      - packages/quality-gates/c2-replay-origin.cjs
      - scripts/c2-152-158-mechanism-cross.cjs
      - scripts/c2-replay-origin.cjs
      - tests/unit/c2-152-158-mechanism-cross.test.cjs
      - tests/unit/c2-replay-origin.test.cjs
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  replay-original-pr186:
    if: >-
      github.event.repository.id == 1418338512 &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'cardenaspiero255-lang/Ultra-Sentinel' &&
        github.event.pull_request.user.login == 'cardenaspiero255-lang') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        github.actor == 'cardenaspiero255-lang'))
    uses: ./.github/workflows/c2-pr186-four-source-cross.yml
    with:
      original_replay: true
    permissions:
      contents: read
      actions: read
  replay-original-owner-rollback:
    if: >-
      github.event.repository.id == 1418338512 &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'cardenaspiero255-lang/Ultra-Sentinel' &&
        github.event.pull_request.user.login == 'cardenaspiero255-lang') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        github.actor == 'cardenaspiero255-lang'))
    uses: ./.github/workflows/c2-rollback-cross-owner.yml
    with:
      original_replay: true
    permissions:
      contents: read
      actions: read
  replay-original-ten-jvm:
    if: >-
      github.event.repository.id == 1418338512 &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'cardenaspiero255-lang/Ultra-Sentinel' &&
        github.event.pull_request.user.login == 'cardenaspiero255-lang') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        github.actor == 'cardenaspiero255-lang'))
    uses: ./.github/workflows/c2-real-causal-jvm-campaign.yml
    with:
      original_replay: true
    permissions:
      contents: read
      actions: read
  adjudicate-source-causal-pairs:
    needs: [replay-original-pr186, replay-original-owner-rollback, replay-original-ten-jvm]
    if: >-
      github.event.repository.id == 1418338512 &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'cardenaspiero255-lang/Ultra-Sentinel' &&
        github.event.pull_request.user.login == 'cardenaspiero255-lang') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        github.actor == 'cardenaspiero255-lang'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Focused and complete unit regression
        run: |
          node --test tests/unit/c2-152-158-mechanism-cross.test.cjs tests/unit/c2-replay-origin.test.cjs
          npm run check
      - name: Authenticate regenerated source experiments and compare mechanisms
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          umask 077
          repo=cardenaspiero255-lang/Ultra-Sentinel
          root="$RUNNER_TEMP/c2-152-158-cross"
          mkdir -p "$root/output" "$root/inputs"
          # Regenerate all four receipts in this run. Never substitute new bytes
          # under an expired historical artifact ID or digest.
          gh api "/repos/$repo/actions/runs/$GITHUB_RUN_ID" > "$root/current-run.json"
          for key in json-query rollback-ttl owner-replay ten-jvm; do
            case "$key" in
              json-query|rollback-ttl) name="c2-pr186-${key}-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"; filename=proof.json ;;
              owner-replay) name="c2-${key}-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"; filename=rollback-cross.json ;;
              ten-jvm) name="c2-${key}-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"; filename=source-kotlin-causal-campaign.json ;;
            esac
            gh api "/repos/$repo/actions/runs/$GITHUB_RUN_ID/artifacts?name=$name&per_page=100" > "$root/current-artifacts.json"
            selected="$(node scripts/c2-replay-origin.cjs "$root/current-run.json" "$root/current-artifacts.json" \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$EXPECTED_HEAD_SHA" "$GITHUB_EVENT_NAME" "$key")"
            read -r artifact digest <<< "$selected"
            gh api "/repos/$repo/actions/artifacts/$artifact/zip" > "$root/$key.zip"
            test "$(stat -c %s "$root/$key.zip")" -le 1000000
            test "$(sha256sum "$root/$key.zip" | cut -d' ' -f1)" = "$digest"
            unzip -Z1 "$root/$key.zip" > "$root/$key.entries"
            test "$(wc -l < "$root/$key.entries")" -eq 1
            grep -Fxq "$filename" "$root/$key.entries"
            mkdir -p "$root/inputs/$key"
            unzip -p "$root/$key.zip" "$filename" | head -c 1800001 > "$root/inputs/$key/$filename"
            test "$(stat -c %s "$root/inputs/$key/$filename")" -le 1800000
            echo "SOURCE_CAUSAL_CURRENT_REPLAY_VERIFIED $key artifact=$artifact"
          done
          node scripts/c2-152-158-mechanism-cross.cjs --same-run-replay \
            "$root/inputs/json-query/proof.json" "$root/inputs/rollback-ttl/proof.json" \
            "$root/inputs/owner-replay/rollback-cross.json" "$root/inputs/ten-jvm/source-kotlin-causal-campaign.json" \
            "$root/output/causal-cross-evidence.json"
          jq -e '
            .schema=="c2-152-158-cross-known-mechanisms/v1" and
            .originalJointJVMRuns==8 and
            .additionalOriginalKotlinJVMExecutions==16 and
            .currentWorkflowNewJVMExecutions==24 and
            .crossProbeEvidenceOrigin=="SAME_RUN_ORIGINAL_SOURCE_REPLAY" and
            .additionalEvidenceOrigin=="SAME_RUN_ORIGINAL_SOURCE_REPLAY" and
            .directJointInterventionContrasts==2 and
            .separateJVMContrasts==1 and .untestedCrossRelations==4 and
            .causalFamiliesIndependentlyCertified==0 and
            .historicalAssignmentsCertifiedClosed==0 and
            .externalGoldLabelsCreated==0 and .nextcloudSourceReleased==false and
            .detectorPredictionsRead==false and .blindHoldoutFrozen==false and
            .precision==null and .recall==null and .f1==null and
            .sssPlusCertified==false
          ' "$root/output/causal-cross-evidence.json" >/dev/null
          rm -rf "$root/inputs" "$root/current-run.json" "$root/current-artifacts.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c2-152-158-evidence-two-pairs-crossed-four-untested
          path: ${{ runner.temp }}/c2-152-158-cross/output/causal-cross-evidence.json
          retention-days: 30
          if-no-files-found: error
