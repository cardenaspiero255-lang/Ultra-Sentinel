name: Ultra Sentinel — phase 2 control-plane regression coverage
on:
  pull_request:
    paths:
      - packages/investigation/plain-kotlin-payload.cjs
      - packages/investigation/novel-kotlin-path-policy.cjs
      - packages/family-hunter/phase2-codec-integrity-hunter.cjs
      - packages/family-hunter/phase2-blind-codec-worker.cjs
      - packages/recovery/phase2-codec-integrity-candidate.cjs
      - tests/unit/phase2-codec-integrity-hunter.test.cjs
      - tests/unit/phase2-codec-integrity-candidate.test.cjs
      - tests/unit/phase2-codec-blind-integration.test.cjs
      - tests/fixtures/gamehub-codec/**
      - packages/family-hunter/phase2-numeric-risk-hunter.cjs
      - packages/family-hunter/blind-numeric-worker.cjs
      - tests/unit/phase2-blind-numeric-worker.test.cjs
      - tests/unit/phase2-blind-numeric-git-inventory.test.cjs
      - tests/unit/phase2-blind-numeric-receipt.test.cjs
      - tests/unit/phase2-blind-numeric-isolation.test.cjs
      - tests/fixtures/gamehub-blind-numeric/**
      - packages/family-hunter/phase2-numeric-semantic-evidence.cjs
      - packages/family-hunter/phase2-numeric-sealed-semantic-link.cjs
      - tests/unit/phase2-numeric-sealed-semantic-link.test.cjs
      - tests/unit/phase2-numeric-sealed-link-cli.test.cjs
      - tests/fixtures/gamehub-three-source/verify-numeric-link.cjs
      - packages/kotlin-semantic/C2NumericSemanticClaims.kt
      - tests/unit/phase2-numeric-semantic-evidence.test.cjs
      - tests/fixtures/gamehub-three-source/verify-numeric-semantic.cjs
      - tests/fixtures/gamehub-three-source/reproduce.sh
      - tests/unit/phase2-numeric-risk-hunter.test.cjs
      - tests/unit/phase2-numeric-original-bridge.test.cjs
      - tests/fixtures/gamehub-three-source/scan-numeric.cjs
      - packages/quality-gates/phase2-causal-factorial.cjs
      - tests/unit/phase2-causal-factorial.test.cjs
      - packages/recovery/phase2-generic-jvm-judge.cjs
      - packages/recovery/phase2-executed-jvm-triplet.cjs
      - tests/unit/phase2-executed-jvm-triplet.test.cjs
      - tests/unit/phase2-generic-jvm-judge.test.cjs
      - packages/memory/phase2-signed-revocation-filter.cjs
      - tests/unit/phase2-signed-revocation-filter.test.cjs
      - packages/memory/memory-local-revocation-journal.cjs
      - tests/unit/memory-local-revocation-journal.test.cjs
      - packages/memory/ultra_sentinel_memory_quarantine.cjs
      - tests/unit/memory-signed-quarantine-integration.test.cjs
      - tests/unit/memory-witness-quarantine-integration.test.cjs
      - tests/unit/memory-quarantine.test.cjs
      - tests/unit/memory-quarantine-journal.test.cjs
      - tests/unit/memory-witness-commit.test.cjs
      - tests/unit/phase2-cross-oracle-trigger.test.cjs
      - .github/workflows/phase2-control-plane-coverage.yml
      - .github/workflows/phase2-jarvis-note-oracle.yml
      - .github/workflows/phase2-blind-elapsed-original-oracle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control-plane-coverage:
    if: >-
      github.event.repository.id == 1418338512 &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'cardenaspiero255-lang/Ultra-Sentinel' &&
        github.event.pull_request.user.id == 322222186) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        github.actor_id == '322222186'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Node major
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Complete structure and regression suite
        run: npm run check
      - name: Require 90 percent coverage across bounded causal, Judge and memory modules
        run: |
          set -euo pipefail
          node --test --experimental-test-coverage \
            --test-coverage-include=packages/quality-gates/phase2-causal-factorial.cjs \
            --test-coverage-lines=90 --test-coverage-branches=90 \
            tests/unit/phase2-causal-factorial.test.cjs
          node --test --experimental-test-coverage \
            --test-coverage-include=packages/recovery/phase2-generic-jvm-judge.cjs \
            --test-coverage-lines=90 --test-coverage-branches=90 \
            tests/unit/phase2-generic-jvm-judge.test.cjs
          node --test --experimental-test-coverage \
            --test-coverage-include=packages/memory/phase2-signed-revocation-filter.cjs \
            --test-coverage-lines=90 --test-coverage-branches=90 \
            tests/unit/phase2-signed-revocation-filter.test.cjs
          node --test --experimental-test-coverage \
            --test-coverage-include=packages/memory/memory-local-revocation-journal.cjs \
            --test-coverage-lines=90 --test-coverage-branches=90 \
            tests/unit/memory-local-revocation-journal.test.cjs
          node --test --experimental-test-coverage \
            --test-coverage-include=packages/memory/ultra_sentinel_memory_quarantine.cjs \
            --test-coverage-lines=90 --test-coverage-branches=90 \
            tests/unit/memory-signed-quarantine-integration.test.cjs \
            tests/unit/memory-witness-quarantine-integration.test.cjs \
            tests/unit/memory-quarantine.test.cjs \
            tests/unit/memory-quarantine-journal.test.cjs \
            tests/unit/memory-witness-commit.test.cjs
          node --test --experimental-test-coverage \
            --test-coverage-include=packages/recovery/phase2-executed-jvm-triplet.cjs \
            --test-coverage-lines=90 --test-coverage-branches=90 \
            tests/unit/phase2-executed-jvm-triplet.test.cjs
          node --test --experimental-test-coverage \
            --test-coverage-include=packages/family-hunter/phase2-numeric-risk-hunter.cjs \
            --test-coverage-lines=90 --test-coverage-branches=90 \
            tests/unit/phase2-numeric-risk-hunter.test.cjs
          node --test --experimental-test-coverage \
            --test-coverage-include=packages/family-hunter/phase2-codec-integrity-hunter.cjs \
            --test-coverage-lines=90 --test-coverage-branches=90 \
            tests/unit/phase2-codec-integrity-hunter.test.cjs
          node --test --experimental-test-coverage \
            --test-coverage-include=packages/recovery/phase2-codec-integrity-candidate.cjs \
            --test-coverage-lines=90 --test-coverage-branches=90 \
            tests/unit/phase2-codec-integrity-candidate.test.cjs
          node --test --experimental-test-coverage \
            --test-coverage-include=packages/family-hunter/phase2-numeric-semantic-evidence.cjs \
            --test-coverage-lines=90 --test-coverage-branches=90 \
            tests/unit/phase2-numeric-semantic-evidence.test.cjs
          node --test --experimental-test-coverage \
            --test-coverage-include=packages/family-hunter/blind-numeric-worker.cjs \
            --test-coverage-lines=90 --test-coverage-branches=90 \
            tests/unit/phase2-blind-numeric-worker.test.cjs
          node --test --experimental-test-coverage \
            --test-coverage-include=tests/fixtures/gamehub-blind-numeric/prepare-inventory.cjs \
            --test-coverage-lines=90 --test-coverage-branches=90 \
            tests/unit/phase2-blind-numeric-git-inventory.test.cjs
          node --test --experimental-test-coverage \
            --test-coverage-include=tests/fixtures/gamehub-blind-numeric/verify-sealed.cjs \
            --test-coverage-lines=90 --test-coverage-branches=90 \
            tests/unit/phase2-blind-numeric-receipt.test.cjs
          node --test --experimental-test-coverage \
            --test-coverage-include=packages/family-hunter/phase2-numeric-sealed-semantic-link.cjs \
            --test-coverage-lines=90 --test-coverage-branches=90 \
            tests/unit/phase2-numeric-sealed-semantic-link.test.cjs \
            tests/unit/phase2-numeric-sealed-link-cli.test.cjs
