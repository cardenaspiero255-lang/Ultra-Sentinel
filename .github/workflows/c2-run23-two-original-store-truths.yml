name: Ultra Sentinel — C2 run23 original store and session source truths
on:
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
concurrency:
  group: ultra-sentinel-c2-run23-source-original
  cancel-in-progress: false
jobs:
  owner-authenticated-controls:
    if: >-
      github.ref == 'refs/heads/main' && github.event.repository.id == 1418338512 &&
      ((github.event_name == 'workflow_dispatch' && github.actor_id == '322222186') ||
       (github.event_name == 'issue_comment' && github.event.action == 'created' &&
        github.event.issue.number == 50 && github.event.issue.pull_request == null &&
        github.event.comment.body == 'ULTRA_SENTINEL_C2_RUN23_STORES_TRUTH_V1' &&
        github.event.comment.user.id == 322222186 &&
        github.event.sender.id == 322222186))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify tests and source contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = main
          npm run check
      - name: Owner authenticated prior 21 labels and original Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/c2-run23"
          repo=cardenaspiero255-lang/Ultra-Sentinel
          mkdir -p "$root/prior"
          gh api "/repos/$repo/actions/runs/39076132177" > "$root/run.json"
          jq -e '.id == 39076132177 and
            .path == ".github/workflows/c2-run23-original-comparison-freshness.yml" and
            .head_sha == "0633de8fec9e06c0249dae8e64cf127dba01b7ae" and
            .head_branch == "main" and .status == "completed" and
            .conclusion == "success" and .actor.id == 322222186 and
            .repository.id == 1418338512' "$root/run.json" >/dev/null
          gh api "/repos/$repo/actions/runs/39076132177/artifacts" > "$root/artifacts.json"
          jq -e '[.artifacts[] | select(
            .id == 12117067167 and
            .name == "ultra-sentinel-c2-run22-original-comparison-freshness-positive" and
            .workflow_run.id == 39076132177 and .expired == false and
            .digest == "sha256:7a77bdc5b53c18c24f87de5c754d094f008639020da1a31fbd67ae5815bf16cc"
          )] | length == 1' "$root/artifacts.json" >/dev/null
          gh run download 39076132177 --repo "$repo" \
            --name ultra-sentinel-c2-run22-original-comparison-freshness-positive --dir "$root/prior"
          test -f "$root/prior/c2-run23-owner-source-truth.json"
          test -f "$root/prior/158-witness.json"
          test "$(find "$root/prior" -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find "$root/prior" -type l | wc -l)" -eq 0
          while IFS='|' read -r alias head blob path; do
            gh api "/repos/cardenaspiero255-lang/gamehub-ultra/contents/$path?ref=$head" \
              > "$root/source-metadata.json"
            jq -e --arg p "$path" --arg s "$blob" \
              '.type=="file" and .path==$p and .sha==$s and
               .size>100 and .encoding=="base64"' "$root/source-metadata.json" >/dev/null
            jq -r .content "$root/source-metadata.json" | base64 --decode > "$root/$alias"
            test "$(git hash-object "$root/$alias")" = "$blob"
          done <<'IMMUTABLE_SOURCES'
          152.kt|104b7dc33e4c0341cec3fca81e3c8fbe3625357f|ed936aa687b08cf8d964d54f9d88e68bb12344ec|app/src/main/java/com/cardenaspiero255/gamehubultra/data/AiProfileProposalStore.kt
          152-caller.kt|104b7dc33e4c0341cec3fca81e3c8fbe3625357f|5e747dd88469b7457269b1e2dc592af9cd439f46|app/src/main/java/com/cardenaspiero255/gamehubultra/GameHubUltraApp.kt
          151.kt|9ad983576c16c6c34d59283979d83c69ede50dce|742e440004d51743e8e4b02c40171f951edfd125|app/src/main/java/com/cardenaspiero255/gamehubultra/data/SessionCoachSessionStore.kt
          151-caller.kt|9ad983576c16c6c34d59283979d83c69ede50dce|ef69341a61164bbd69832f26186e48582c1b3042|app/src/main/java/com/cardenaspiero255/gamehubultra/session/SessionCoachMonitorService.kt
          IMMUTABLE_SOURCES
          grep -Fq 'recordApplied = aiProfileProposalStore::recordApplied' "$root/152-caller.kt"
          grep -Fq 'expectedSessionId = sessionId' "$root/151-caller.kt"
          test "$(sha256sum "$root/152.kt" | cut -d' ' -f1)" = f06604f1bdd7bba80d060adac49d99d9edfb38234e47a91d2f861af3997435da
          test "$(sha256sum "$root/151.kt" | cut -d' ' -f1)" = d8dbd5fadac170ed7b36c844f2480a03185046f381f64fd30feee0d20c219a70
          rm -f "$root/152-caller.kt" "$root/151-caller.kt" \
            "$root/run.json" "$root/artifacts.json" "$root/source-metadata.json"
      - name: Mandatory networkless Bubblewrap and AppArmor
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -qq \
            bubblewrap apparmor apparmor-utils apparmor-profiles
          src=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$src" && test ! -L "$src"
          sudo install -o root -g root -m 0644 "$src" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Execute original stores and sensitivity counterfactuals
        shell: bash
        run: |
          set -euo pipefail
          C2_OWNER_SANDBOX=1 bash scripts/c2-run20-owner-original-oracles.sh \
            "$RUNNER_TEMP/c2-run23"
          test -s "$RUNNER_TEMP/c2-run23/152-witness.json"
          test -s "$RUNNER_TEMP/c2-run23/151-witness.json"
      - name: Append store positive and session negative to immutable prior 21
        shell: bash
        env:
          OWNER_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          test "$OWNER_ACTOR_ID" = 322222186
          node - <<'NODE'
          'use strict';
          const fs=require('node:fs'),crypto=require('node:crypto');
          const {presealRun23}=require('./packages/quality-gates/c2-run23-original-stores.cjs');
          if(process.env.GITHUB_ACTIONS!=='true'||
             process.env.GITHUB_REPOSITORY!=='cardenaspiero255-lang/Ultra-Sentinel'||
             process.env.GITHUB_REF!=='refs/heads/main'||!/^\d+$/.test(process.env.GITHUB_RUN_ID||''))
            throw Error('C2_RUN23_OWNER_BLOCKED');
          const root=process.env.RUNNER_TEMP+'/c2-run23';
          const prior=JSON.parse(fs.readFileSync(root+'/prior/c2-run23-owner-source-truth.json','utf8'));
          const witnesses=[152,151].map(n=>JSON.parse(fs.readFileSync(root+'/'+n+'-witness.json','utf8')));
          const preseal=presealRun23({prior,witnesses});
          const receipt={...preseal,
            schema:'ultra-sentinel-c2-run23-owner-source-truth-seal/v1',
            status:'SOURCE_BEHAVIOR_TRUTH_PARTIAL',ownerRunId:Number(process.env.GITHUB_RUN_ID),
            witnessDigest:crypto.createHash('sha256').update(JSON.stringify(witnesses)).digest('hex'),
            sourceCIAuthenticated:true,benchmarkCertified:false,verdict:'TRUTH_CORPUS_INCOMPLETE'};
          fs.writeFileSync(root+'/c2-run23-owner-source-truth.json',
            JSON.stringify(receipt,null,2)+'\n',{flag:'wx',mode:0o600});
          NODE
          jq -e '.schema=="ultra-sentinel-c2-run23-owner-source-truth-seal/v1" and
            (.labels|length)==23 and .sourcePositiveLabels==11 and
            .verifiedScopedNegativeLabels==12 and .neededAdditionalLabelsAtLeast==97 and
            .benchmarkScoredLabels==0 and .precision==null and
            .recall==null and .f1==null and .blindHoldoutCertified==false and
            .tripleSPlusCertified==false and .sourceCIAuthenticated==true and
            .candidatePredictionsRead==false and .baselinePredictionsRead==false' \
            "$RUNNER_TEMP/c2-run23/c2-run23-owner-source-truth.json" >/dev/null
      - name: Preserve audit receipts without original untrusted source bytes
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: ultra-sentinel-c2-run23-two-store-source-truths
          path: |
            ${{ runner.temp }}/c2-run23/c2-run23-owner-source-truth.json
            ${{ runner.temp }}/c2-run23/152-witness.json
            ${{ runner.temp }}/c2-run23/151-witness.json
          retention-days: 14
          if-no-files-found: error
