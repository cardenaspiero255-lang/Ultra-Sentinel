name: C2 authentic labels one-shot preadmission (NO GOLD)
# This workflow ONLY partitions frozen source-free candidates, never reads
# PR source, external code, detector predictions or executes any oracle.
on:
  pull_request:
    paths:
      - .github/workflows/c2-one-shot-111-admission.yml
      - packages/quality-gates/c2-one-shot-111-admission.cjs
      - scripts/c2-one-shot-111-admission.cjs
      - tests/unit/c2-one-shot-111-admission.test.cjs
      - tests/unit/c2-one-shot-111-workflow.test.cjs
      - docs/quality/C2-ONE-SHOT-111-AUTHENTIC-LABEL-CAMPAIGN-20261024.md
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: c2-one-shot-authentic-111-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-tdd-and-architecture:
    if: >-
      github.event.repository.id == 1418338512 &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.id == 1418338512))
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm run check
  introducing-owner-once:
    needs: [offline-tdd-and-architecture]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.id == 1418338512 &&
      github.actor_id == '322222186'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      introduced: ${{ steps.once.outputs.introduced }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: once
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ] &&
            git diff --name-only "$GITHUB_SHA^1" "$GITHUB_SHA" |
              grep -Fxq 'docs/quality/C2-ONE-SHOT-111-AUTHENTIC-LABEL-CAMPAIGN-20261024.md'; then
            echo 'introduced=true' >> "$GITHUB_OUTPUT"
          else
            echo 'introduced=false' >> "$GITHUB_OUTPUT"
          fi
  owner-155-batch-admission:
    needs: [offline-tdd-and-architecture,introducing-owner-once]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.id == 1418338512 &&
      github.actor_id == '322222186' &&
      needs.offline-tdd-and-architecture.result == 'success' &&
      needs.introducing-owner-once.outputs.introduced == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify original GitHub ranking owner, main commit and artifact digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api '/repos/cardenaspiero255-lang/Ultra-Sentinel/actions/runs/40148603915' |
            jq -e '.id==40148603915 and .status=="completed" and
              .conclusion=="success" and .repository.id==1418338512 and
              .head_sha=="f91cbc71074f39254c6d3058d186319d7b483bc1" and
              .actor.id==322222186 and .head_branch=="main" and
              .event=="push"' >/dev/null
          gh api '/repos/cardenaspiero255-lang/Ultra-Sentinel/actions/runs/40148603915/artifacts' |
            jq -e '[.artifacts[] | select(
              .id==12581349654 and
              .name=="c2-155-frozen-integrity-first-shortlist-NO-GOLD" and
              .digest=="sha256:88a7f5764b156c7713f324667839f6f96172cfdfee95a2d8d4d519d131426003" and
              .expired==false and .workflow_run.id==40148603915 and
              .workflow_run.repository_id==1418338512
              )] | length==1' >/dev/null
      - name: Retrieve ONLY owner-verified source-free ranking JSON
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: c2-155-frozen-integrity-first-shortlist-NO-GOLD
          run-id: 40148603915
          repository: cardenaspiero255-lang/Ultra-Sentinel
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/c2-one-shot-input
      - name: Recompute all 155 and partition 32 metadata-only queues; no oracles
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "$RUNNER_TEMP/c2-one-shot-input" -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(find "$RUNNER_TEMP/c2-one-shot-input" -type l | wc -l)" -eq 0
          test -f "$RUNNER_TEMP/c2-one-shot-input/report.json"
          node scripts/c2-one-shot-111-admission.cjs \
            "$RUNNER_TEMP/c2-one-shot-input/report.json" \
            > "$RUNNER_TEMP/c2-one-shot-111-admission.json"
          jq -e '.schema=="c2-one-shot-111-bulk-admission/v1" and
            .sourceCandidates==155 and .sourcePreviouslyExposed==14 and
            .totalBatchShards==32 and .missingAuthenticLabels==111 and
            .newGoldLabels==0 and .authorizedSourceReads==0 and
            .originalFixBenignExecuted==0 and .truthSealed==false and
            .candidateSourceInspected==false and .sssPlusCertified==false' \
            "$RUNNER_TEMP/c2-one-shot-111-admission.json" >/dev/null
          jq -c '{status,sourceCandidates,comparable,metadataRetryCount,
            bulkManualReviewCount,nonHintedCount,mechanismHinted,
            ownerGateRequiredCount,authorizedSourceReads,missingAuthenticLabels,
            newGoldLabels,sssPlusCertified}' \
            "$RUNNER_TEMP/c2-one-shot-111-admission.json"
      - name: Publish one honest admission report, never oracle receipts or labels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c2-one-shot-111-admission-NO-GOLD
          path: ${{ runner.temp }}/c2-one-shot-111-admission.json
          if-no-files-found: error
          retention-days: 30
