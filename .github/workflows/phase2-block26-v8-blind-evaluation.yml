          test "$(sha256sum "$archive" | cut -d ' ' -f1)" = 0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a
          mkdir "$RUNNER_TEMP/kotlin-v8-original"
          unzip -q "$archive" -d "$RUNNER_TEMP/kotlin-v8-original"
      - name: Download preceding job's already-published prediction artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: block26-v8-frozen-predictions
          path: ${{ runner.temp }}/v8-predictions
      - name: Reauthenticate original prediction seal then run independent oracles
        shell: bash
        run: |
          set -euo pipefail
          node scripts/phase2-block26-v8-experiment.cjs independent "$GITHUB_WORKSPACE/frozen-v7-engine" "$GITHUB_WORKSPACE/originals" "$RUNNER_TEMP/kotlin-v8-original/kotlinc" \
            "$RUNNER_TEMP/v8-independent-work" "$RUNNER_TEMP/v8-independent" \
            "$RUNNER_TEMP/v8-predictions"
          test -s "$RUNNER_TEMP/v8-independent/independent-truth.json"
          test -s "$RUNNER_TEMP/v8-independent/independent-verdict.json"
      - name: Publish immutable independent verdict with all abstentions
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: block26-v8-independent-verdict
          path: ${{ runner.temp }}/v8-independent/
