name: C2 Nextcloud Talk 6940 one-time owner source release (NO GOLD)
on:
  pull_request:
    paths:
      - .github/workflows/c2-nextcloud-talk6940-source-release.yml
      - packages/quality-gates/c2-ranked-owner-source-release.cjs
      - tests/unit/c2-ranked-owner-source-release.test.cjs
      - docs/quality/C2-NEXTCLOUD-TALK6940-PREAUTHORIZED-SOURCE-20261024.json
      - docs/quality/C2-NEXTCLOUD-TALK6940-OWNER-RELEASE-20261024.md
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: c2-ranked-owner-source-6940-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-free-contracts:
    if: >-
      github.event.repository.id == 1418338512 &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.id == 1418338512))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm run check
  owner-introduction-only:
    needs: [source-free-contracts]
    if: >-
      github.event_name == 'push' &&
      github.event.repository.id == 1418338512 &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '322222186'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      introduced: ${{ steps.one.outputs.introduced }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: one
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ] &&
            git diff --name-only "$GITHUB_SHA^1" "$GITHUB_SHA" |
              grep -Fxq 'docs/quality/C2-NEXTCLOUD-TALK6940-PREAUTHORIZED-SOURCE-20261024.json'; then
            echo "introduced=true" >> "$GITHUB_OUTPUT"
          else
            echo "introduced=false" >> "$GITHUB_OUTPUT"
          fi
  owner-source-only:
    needs: [source-free-contracts,owner-introduction-only]
    if: >-
      github.event_name == 'push' &&
      github.event.repository.id == 1418338512 &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '322222186' &&
      needs.owner-introduction-only.outputs.introduced == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify frozen original Core and one-time owner merge
        run: |
          set -euo pipefail
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
          git diff --name-only "$GITHUB_SHA^1" "$GITHUB_SHA" |
            grep -Fxq 'docs/quality/C2-NEXTCLOUD-TALK6940-PREAUTHORIZED-SOURCE-20261024.json'
          test "$(git rev-parse 547938ed88804e25bbabecf74a3c3d91b74cf1a4:packages/core/ultra_sentinel_core.cjs)" = db29f94be1e0afb791a241d26f449695df0eafd0
      - name: Authenticate one PR tuple and sanitized changed-file Git IDs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/c2-ranked-6940"
          mkdir -m 700 "$root"
          gh api '/repos/nextcloud/talk-android/pulls/6940' |
            jq -e '{number,created_at,state,base:{sha:.base.sha,repo:{full_name:.base.repo.full_name}},head:{sha:.head.sha}}' > "$root/pr.json"
          gh api '/repos/nextcloud/talk-android/pulls/6940/files?per_page=100' |
            jq -e '[.[]|{filename,status,sha,additions,deletions,changes}]' > "$root/files.json"
          node - "$root/pr.json" "$root/files.json" "$root/release.json" <<'NODE'
          const fs=require('node:fs');
          const read=x=>require('./docs/quality/'+x+'.json');
          const {validateRankedOwnerSourceRelease}=require('./packages/quality-gates/c2-ranked-owner-source-release.cjs');
          const request=read('C2-NEXTCLOUD-TALK6940-PREAUTHORIZED-SOURCE-20261024');
          const value=validateRankedOwnerSourceRelease({
            request,
            roster:read('C2-BULK-PROSPECTIVE-PR-METADATA-20261024'),
            eight:read('C2-EIGHT-INSPECTED-PR-QUARANTINE-20261024'),
            prior:[
              read('C2-LAWNCHAIR7428-OWNER-RELEASED-DISPOSITION-20261024').original,
              read('C2-BITWARDEN7499-OWNER-RELEASED-DISPOSITION-20261024').candidate,
              read('C2-HA7681-OWNER-RELEASED-DISPOSITION-20261024').candidate
            ],
            api:JSON.parse(fs.readFileSync(process.argv[2],'utf8')),
            files:JSON.parse(fs.readFileSync(process.argv[3],'utf8')),
            event:{actorId:Number(process.env.GITHUB_ACTOR_ID),
              repositoryId:Number(process.env.GITHUB_REPOSITORY_ID),
              eventName:process.env.GITHUB_EVENT_NAME,ref:process.env.GITHUB_REF,
              commit:process.env.GITHUB_SHA}
          });
          fs.writeFileSync(process.argv[4],JSON.stringify(value,null,2)+'\n',{flag:'wx',mode:0o600});
          NODE
          (cd "$root" && sha256sum release.json > SHA256SUMS)
          rm -f "$root/pr.json" "$root/files.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c2-nextcloud-talk-6940-owner-source-permit-NOT-GOLD
          path: ${{ runner.temp }}/c2-ranked-6940/
          retention-days: 30
          if-no-files-found: error
  independent-git-blob-attestor:
    needs: [owner-source-only]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '322222186'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: c2-nextcloud-talk-6940-owner-source-permit-NOT-GOLD
          path: ${{ runner.temp }}/c2-ranked-6940-attested
      - name: Reverify current run, owner, PR Git ancestry and 4 immutable blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/c2-ranked-6940-attested"
          test "$(find "$root" -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find "$root" -type l | wc -l)" -eq 0
          (cd "$root" && sha256sum -c SHA256SUMS)
          jq -e '.candidate.pr==6940 and .sourceReadPermitted==true and
            .ruleMatched==false and .truthSealed==false and
            .newGoldLabels==0 and .detectorPredictionsRead==false' "$root/release.json" >/dev/null
          gh api "/repos/cardenaspiero255-lang/Ultra-Sentinel/actions/runs/$GITHUB_RUN_ID" |
            jq -e --arg sha "$GITHUB_SHA" --argjson id "$GITHUB_RUN_ID" '
              .id==$id and .head_sha==$sha and .repository.id==1418338512 and
              .actor.id==322222186 and .event=="push" and .head_branch=="main"' >/dev/null
          gh api "/repos/cardenaspiero255-lang/Ultra-Sentinel/actions/runs/$GITHUB_RUN_ID/artifacts" |
            jq -e --argjson id "$GITHUB_RUN_ID" '
              [.artifacts[]|select(.name=="c2-nextcloud-talk-6940-owner-source-permit-NOT-GOLD" and
               .workflow_run.id==$id and .workflow_run.repository_id==1418338512 and
               .expired==false and (.digest|test("^sha256:[0-9a-f]{64}$")))]|length==1' >/dev/null
          gh api '/repos/nextcloud/talk-android/pulls/6940' |
            jq -e '.number==6940 and .created_at=="2026-10-22T14:44:23Z" and
              .base.repo.full_name=="nextcloud/talk-android" and
              .base.sha=="48880fb92e49a3cd3fa345e6e10bd21f80cc5b1a" and
              .head.sha=="45b1a9c6aa24def1ee2e6ae3e2aeb01ff2626772"' >/dev/null
          gh api '/repos/nextcloud/talk-android/git/commits/48880fb92e49a3cd3fa345e6e10bd21f80cc5b1a' |
            jq -e '.sha=="48880fb92e49a3cd3fa345e6e10bd21f80cc5b1a" and (.tree.sha|test("^[0-9a-f]{40}$"))' >/dev/null
          gh api '/repos/nextcloud/talk-android/git/commits/45b1a9c6aa24def1ee2e6ae3e2aeb01ff2626772' |
            jq -e '.sha=="45b1a9c6aa24def1ee2e6ae3e2aeb01ff2626772" and (.tree.sha|test("^[0-9a-f]{40}$"))' >/dev/null
          gh api '/repos/nextcloud/talk-android/pulls/6940/files?per_page=100' |
            jq -e '[.[]|{filename,status,sha,additions,deletions,changes}]' > "$RUNNER_TEMP/c2-ranked-independent-paths.json"
          node - "$RUNNER_TEMP/c2-ranked-independent-paths.json" <<'NODE'
          const fs=require('node:fs');
          const r=require('./docs/quality/C2-NEXTCLOUD-TALK6940-PREAUTHORIZED-SOURCE-20261024.json');
          const actual=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const sorted=x=>[...x].sort((a,b)=>a.filename.localeCompare(b.filename));
          if(actual.length!==4||JSON.stringify(sorted(actual))!==JSON.stringify(sorted(r.pathScope)))
           throw Error('C2_RANKED_INDEPENDENT_BLOB_DRIFT');
          NODE
          echo 'C2_RANKED_NEXTCLOUD6940_OWNER_SOURCE_VERIFIED_NOT_GOLD_NO_ORACLE'
