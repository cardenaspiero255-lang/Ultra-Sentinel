name: Ultra Sentinel — C2 original Kotlin source behavioral oracles
# Owner-authenticated, frozen SHA Git blobs, isolated JVM, sanitized JSON.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultra-sentinel-c2-kotlin-original-oracles-main
  cancel-in-progress: false

jobs:
  kotlin-original-behavior:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.repository.id == 1418338512 &&
      ((github.event_name == 'workflow_dispatch' && github.actor_id == '322222186') ||
       (github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.issue.number == 50 &&
        github.event.issue.pull_request == null &&
        github.event.comment.body == 'ULTRA_SENTINEL_C2_KOTLIN_ORACLES_V1' &&
        github.event.comment.user.id == 322222186 &&
        github.event.sender.id == 322222186))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted Ultra Sentinel main without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: main
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate main source contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = main
          npm run check
      - name: Fetch seven original Kotlin Git blobs on frozen PR HEADs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/c2-kotlin-pinned"
          mkdir -p "$root"
          chmod 0700 "$root"
          node -e '
            const {PINNED}=require("./packages/quality-gates/c2-pinned-kotlin-sources.cjs");
            for(const s of PINNED)process.stdout.write(
              [s.pr,s.headSha,s.blobSha,s.path].join("|")+"\n");
          ' > "$RUNNER_TEMP/c2-kotlin-manifest-lines"
          while IFS='|' read -r pr head blob path; do
            dest="$root/$pr"
            mkdir -p "$dest"
            chmod 0700 "$dest"
            file="${path##*/}"
            metadata="$RUNNER_TEMP/c2-kotlin-github-metadata.json"
            gh api -H 'Accept: application/vnd.github+json' \
              "/repos/cardenaspiero255-lang/gamehub-ultra/contents/$path?ref=$head" > "$metadata"
            jq -e --arg blob "$blob" \
              '.type == "file" and .encoding == "base64" and .sha == $blob and
               .size >= 100 and .size <= 100000 and (.content | type == "string")' \
              "$metadata" >/dev/null
            jq -r .content "$metadata" | base64 --decode > "$dest/$file"
            test "$(git hash-object "$dest/$file")" = "$blob"
            chmod 0400 "$dest/$file"
          done < "$RUNNER_TEMP/c2-kotlin-manifest-lines"
          rm -f "$RUNNER_TEMP/c2-kotlin-manifest-lines" "$RUNNER_TEMP/c2-kotlin-github-metadata.json"
          node packages/quality-gates/c2-pinned-kotlin-sources.cjs "$root"
      - name: Compile original Kotlin behavior with test-only type shims
        shell: bash
        run: |
          set -euo pipefail
          command -v kotlinc
          command -v java
          src="$RUNNER_TEMP/c2-kotlin-pinned"
          build="$RUNNER_TEMP/c2-kotlin-bundle"
          mkdir -p "$build"
          chmod 0700 "$build"
          kotlinc \
            "$src/132/HomeUiState.kt" \
            "$src/159/FramePacingIntelligenceEngine.kt" \
            "$src/159/FramePacingModels.kt" \
            "$src/159/FramePacingPolicy.kt" \
            "$src/161/NetworkGamingDiagnosticsEngine.kt" \
            "$src/161/NetworkGamingDiagnosticsModels.kt" \
            "$src/161/NetworkGamingDiagnosticsPolicy.kt" \
            tests/oracles/c2-kotlin-domain-stubs.kt \
            tests/oracles/c2-kotlin-network-stubs.kt \
            tests/oracles/c2-kotlin-compose-runtime-stubs.kt \
            tests/oracles/c2-kotlin-compose-saveable-stubs.kt \
            tests/oracles/c2-pinned-gamehub-oracles.kt \
            -include-runtime -d "$build/c2-oracles.jar"
          test -s "$build/c2-oracles.jar"
          chmod 0400 "$build/c2-oracles.jar"
      - name: Install Bubblewrap under restricted Ubuntu AppArmor policy
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            bubblewrap apparmor apparmor-utils apparmor-profiles
          src=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$src" && test ! -L "$src"
          sudo install -o root -g root -m 0644 "$src" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          test -x /usr/bin/bwrap
      - name: Run immutable Kotlin oracles without network, tokens or host filesystem
        shell: bash
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/c2-kotlin-bundle"
          jdk="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          test -x "$jdk/bin/java"
          mkdir -p "$RUNNER_TEMP/c2-kotlin-empty-home"
          chmod 0700 "$RUNNER_TEMP/c2-kotlin-empty-home"
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/c2-kotlin-empty-home" \
            /usr/bin/bwrap --die-with-parent --unshare-all --new-session --clearenv \
            --setenv PATH /usr/bin:/bin --setenv HOME /tmp \
            --ro-bind /usr /usr \
            --ro-bind "$jdk" /jdk \
            --ro-bind "$build" /workspace \
            --proc /proc --dev /dev --tmpfs /tmp \
            --dir /home --chdir /workspace \
            -- /jdk/bin/java -jar /workspace/c2-oracles.jar \
            > "$RUNNER_TEMP/c2-kotlin-source-witness.json"
          jq -e '.schema == "ultra-sentinel-c2-kotlin-owner-oracles/v1" and
            (.cases | length) == 3 and
            .cases[0].pr == 132 and .cases[0].passed == true and
            .cases[1].pr == 159 and .cases[1].reproduced == true and
            .cases[2].pr == 161 and .cases[2].reproduced == true and
            .controlsPassed == true and
            .externalIndependenceClaimed == false and
            .tripleSPlusCertified == false and .autoMerge == false' \
            "$RUNNER_TEMP/c2-kotlin-source-witness.json" >/dev/null
          echo "C2_ORIGINAL_KOTLIN_SOURCE_CONTROLS_PASSED"
          cat "$RUNNER_TEMP/c2-kotlin-source-witness.json"
      - name: Archive minimal source witness with no source, secrets or tokens
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: ultra-sentinel-c2-kotlin-original-witness
          path: ${{ runner.temp }}/c2-kotlin-source-witness.json
          if-no-files-found: error
          retention-days: 7
