          test "$(sha256sum "$archive" | cut -d' ' -f1)" = 0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a
          mkdir "$RUNNER_TEMP/kotlin-v6"
          unzip -q "$archive" -d "$RUNNER_TEMP/kotlin-v6"
      - name: Authenticate the already sealed blind ABI admission threshold
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const m=require('./docs/quality/PHASE2-BLOCK26-V6-COHORT.json');
          const p='docs/quality/evidence/block26-v6-admission/admission.json';
          const bytes=fs.readFileSync(p),a=JSON.parse(bytes);
          assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),m.admission.admissionSha256);
          assert.equal(a.engineSha,m.engine.commitSha);assert.equal(a.hunterExecuted,false);
          assert.ok(a.discoveryTechnicallyAdmissible);
          assert.ok(a.callableCandidates>=m.admission.minimumCallableCandidates);
          assert.ok(a.candidateCohorts>=m.admission.minimumCohorts);
          assert.deepEqual(a.cohorts.flatMap(c=>c.originalBlobs),m.cohorts.flatMap(c=>c.source.files.map(f=>f.blobSha)));
          JS
      - name: Execute only frozen Hunter and seal all original predictions and abstentions
        shell: bash
        run: |
          set -euo pipefail
          node tests/fixtures/phase2-kotlin-api-v6/capture.cjs docs/quality/PHASE2-BLOCK26-V6-COHORT.json "$GITHUB_WORKSPACE/frozen-v6-engine" "$GITHUB_WORKSPACE/originals" "$RUNNER_TEMP/kotlin-v6/kotlinc" "$RUNNER_TEMP/v6-hunter-work" "$RUNNER_TEMP/v6-predictions"
          node scripts/phase2-kotlin-api-v6-eval.cjs verify docs/quality/PHASE2-BLOCK26-V6-COHORT.json "$RUNNER_TEMP/v6-predictions" "$RUNNER_TEMP/v6-predictions/prediction-seal.json"
          cat "$RUNNER_TEMP/v6-predictions/prediction-seal.json"
          node - "$RUNNER_TEMP/v6-predictions" <<'JS'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const dir=process.argv[2],index=JSON.parse(fs.readFileSync(path.join(dir,'index.json')));
          for(const item of index){
           if(!/^cohort-[1-6]\/scope-\d{1,2}\/discovery\.json$/.test(item.file))throw Error('V6_REPORT_PATH_REFUSED');
           const bytes=fs.readFileSync(path.join(dir,item.file));
           console.log('V6_SEALED_REPORT:'+JSON.stringify({file:item.file,rawOutputBase64:bytes.toString('base64'),sha256:crypto.createHash('sha256').update(bytes).digest('hex')}));
          }
          JS
      - name: Publish sealed original predictions BEFORE independent verdicts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: block26-v6-frozen-original-predictions
