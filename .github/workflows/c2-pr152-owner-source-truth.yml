name: Ultra Sentinel — C2 owner PR152 source truth (one new identity)
# The only trigger that may seal source truth is owner-initiated trusted-main CI.
on:
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
concurrency:
  group: c2-pr152-owner-source-truth
  cancel-in-progress: false
jobs:
  source-pr152-owner-truth:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.repository.id == 1418338512 &&
      ((github.event_name == 'workflow_dispatch' && github.actor_id == '322222186') ||
       (github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.issue.number == 50 &&
        github.event.issue.pull_request == null &&
        github.event.comment.body == 'ULTRA_SENTINEL_C2_PR152_OWNER_SOURCE_TRUTH_V1' &&
        github.event.comment.user.id == 322222186 &&
        github.event.sender.id == 322222186))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main, never retain credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify the source-truth gate and repository checks
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = main
          npm run check
      - name: Authenticate owner-sealed ten-label artifact and frozen PR152 original
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/c2-pr152"
          mkdir -p "$root/truth"
          repo=cardenaspiero255-lang/Ultra-Sentinel
          gh api "/repos/$repo/actions/runs/38988567892" > "$root/old-run.json"
          jq -e '.id == 38988567892 and .path == ".github/workflows/c2-next-ten-original-source-truth-seal.yml" and
            .head_sha == "31e85757b2daad48882e93a9acf9f30db7b4973e" and
            .status == "completed" and .conclusion == "success" and
            .head_branch == "main" and .actor.id == 322222186 and
            .repository.id == 1418338512' "$root/old-run.json" >/dev/null
          gh api "/repos/$repo/actions/runs/38988567892/artifacts" > "$root/old-artifacts.json"
          jq -e '[.artifacts[] | select(.id == 12084415965 and
            .name == "ultra-sentinel-c2-next-ten-source-truth" and
            .workflow_run.id == 38988567892 and .expired == false and
            .digest == "sha256:8aea2d5ae2ee931dbd3dadf34ca5035d6dd9501ffdc260ae7dabf910b6cd5fcb")] | length == 1' \
            "$root/old-artifacts.json" >/dev/null
          gh run download 38988567892 --repo "$repo" \
            --name ultra-sentinel-c2-next-ten-source-truth --dir "$root/truth"
          test -f "$root/truth/c2-ten-source-truth.json"
          test "$(find "$root/truth" -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(find "$root/truth" -type l | wc -l)" -eq 0
          jq -e '.sealedTruthDigest == "8caeb151cc191132cad2afa088b4a46e419ed72518f80cbeb9626a91ad8f0112" and
            .sourcePositiveLabels == 5 and .verifiedScopedNegativeLabels == 5 and
            (.labels | length) == 10 and .benchmarkScoredLabels == 0' \
            "$root/truth/c2-ten-source-truth.json" >/dev/null
          source_path=app/src/main/java/com/cardenaspiero255/gamehubultra/ai/UltraResearchJsonCodec.kt
          head=104b7dc33e4c0341cec3fca81e3c8fbe3625357f
          gh api "/repos/cardenaspiero255-lang/gamehub-ultra/contents/$source_path?ref=$head" \
            > "$root/original-metadata.json"
          jq -e '.type == "file" and
            .sha == "886c104effd553cd60f8222bfb05b8505fe7c4b8" and
            .encoding == "base64" and .size == 7262' "$root/original-metadata.json" >/dev/null
          jq -r .content "$root/original-metadata.json" | base64 --decode \
            > "$root/UltraResearchJsonCodec.kt"
          test "$(git hash-object "$root/UltraResearchJsonCodec.kt")" = 886c104effd553cd60f8222bfb05b8505fe7c4b8
          test "$(sha256sum "$root/UltraResearchJsonCodec.kt" | cut -d' ' -f1)" = 642d4f0a991bdcbe78c1be408fe49de9b04b72255f345fa59a8f7054cd72b4d2
          rm -f "$root/old-run.json" "$root/old-artifacts.json" "$root/original-metadata.json"
      - name: Require networkless JVM isolation (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -qq \
            bubblewrap apparmor apparmor-utils apparmor-profiles
          src=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$src" && test ! -L "$src"
          sudo install -o root -g root -m 0644 "$src" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          test -x /usr/bin/bwrap
      - name: Execute unmodified historical Kotlin and kill one counterfactual
        shell: bash
        run: |
          set -euo pipefail
          C2_OWNER_SANDBOX=1 bash scripts/c2-pr152-owner-oracle.sh "$RUNNER_TEMP/c2-pr152"
          test -s "$RUNNER_TEMP/c2-pr152/witness.json"
      - name: Produce exactly one source-truth identity, no benchmark or training
        shell: bash
        env:
          OWNER_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          test "$OWNER_ACTOR_ID" = 322222186
          node - <<'NODE'
          'use strict';
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const {reviewEleven}=require('./packages/quality-gates/c2-pr152-owner-truth.cjs');
          if(process.env.GITHUB_ACTIONS!=='true'||
             process.env.GITHUB_REPOSITORY!=='cardenaspiero255-lang/Ultra-Sentinel'||
             process.env.GITHUB_REF!=='refs/heads/main'||
             !/^\d+$/.test(process.env.GITHUB_RUN_ID||''))throw Error('C2_OWNER_JOB_BLOCKED');
          const root=process.env.RUNNER_TEMP+'/c2-pr152';
          const prior=JSON.parse(fs.readFileSync(root+'/truth/c2-ten-source-truth.json','utf8'));
          const witness=JSON.parse(fs.readFileSync(root+'/witness.json','utf8'));
          const staged=reviewEleven({prior,witness});
          const receipt={...staged,
            schema:'ultra-sentinel-c2-pr152-owner-source-truth-seal/v1',
            status:'SOURCE_BEHAVIOR_TRUTH_PARTIAL',
            ownerRunId:Number(process.env.GITHUB_RUN_ID),
            originalWitnessSha256:crypto.createHash('sha256').update(fs.readFileSync(root+'/witness.json')).digest('hex'),
            sourceCIAuthenticated:true,benchmarkCertified:false,verdict:'TRUTH_CORPUS_INCOMPLETE'};
          fs.writeFileSync(root+'/c2-pr152-owner-truth.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
          jq -e '.status == "SOURCE_BEHAVIOR_TRUTH_PARTIAL" and
            (.labels | length) == 11 and .sourcePositiveLabels == 6 and
            .verifiedScopedNegativeLabels == 5 and .neededAdditionalLabelsAtLeast == 109 and
            .benchmarkScoredLabels == 0 and .precision == null and .recall == null and .f1 == null and
            .fpNonRegressionVerified == false and .tripleSPlusCertified == false and
            .sourceCIAuthenticated == true and .benchmarkCertified == false' \
            "$RUNNER_TEMP/c2-pr152/c2-pr152-owner-truth.json" >/dev/null
      - name: Archive only partial original-source truth; never detector predictions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: ultra-sentinel-c2-pr152-owner-source-truth
          path: ${{ runner.temp }}/c2-pr152/c2-pr152-owner-truth.json
          retention-days: 14
          if-no-files-found: error
