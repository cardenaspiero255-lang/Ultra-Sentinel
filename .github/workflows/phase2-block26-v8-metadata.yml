name: Ultra Sentinel — Block 2.6 v8 metadata-only structural candidate scout
on:
  pull_request:
    paths:
      - .github/workflows/phase2-block26-v8-metadata.yml
      - docs/quality/PHASE2-BLOCK26-V8-FREEZE.json
      - docs/quality/PHASE2-BLOCK26-V8-EXCLUSIONS.json
      - packages/quality-gates/v8-structural-diversity.cjs
      - tests/unit/phase2-block26-v8-*.test.cjs
      - scripts/phase2-kotlin-api-v8-candidate-pool.cjs
permissions:
  contents: read
jobs:
  metadata-before-abi:
    if: >-
      github.event.repository.id == 1418338512 &&
      github.event.pull_request.head.repo.full_name == 'cardenaspiero255-lang/Ultra-Sentinel' &&
      github.event.pull_request.user.id == 322222186
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact protocol without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pin Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify tests and prospective frozen hashes before any repository search
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node --test tests/unit/phase2-block26-v8-structural-diversity.test.cjs tests/unit/phase2-block26-v8-freeze.test.cjs tests/unit/phase2-block26-v8-candidate-pool.test.cjs
      - name: Reserve source identities as uncommitted ABI candidate pool using metadata only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/phase2-kotlin-api-v8-candidate-pool.cjs "$RUNNER_TEMP/v8-metadata-only"
          test -s "$RUNNER_TEMP/v8-metadata-only/v8-metadata-candidates.json"
      - name: Preserve raw prospective metadata candidate pool for integrity and independent reproducibility
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: block26-v8-metadata-candidate-pool
          path: ${{ runner.temp }}/v8-metadata-only/v8-metadata-candidates.json
          if-no-files-found: error
          retention-days: 90
