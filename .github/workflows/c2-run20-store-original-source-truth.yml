name: Ultra Sentinel — C2 owner stale rollback and session identity source truth
# No detector prediction/score, no training and no automatic repair.
on:
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
concurrency:
  group: ultra-sentinel-c2-run20-owner-original-store-truth
  cancel-in-progress: false
jobs:
  owner-original-sessions:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.repository.id == 1418338512 &&
      ((github.event_name == 'workflow_dispatch' &&
        github.actor_id == '322222186') ||
       (github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.issue.number == 50 &&
        github.event.issue.pull_request == null &&
        github.event.comment.body == 'ULTRA_SENTINEL_C2_RUN20_STALE_ROLLBACK_SESSION_TRUTH_V1' &&
        github.event.comment.user.id == 322222186 &&
        github.event.sender.id == 322222186))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main without saving credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check all contracts and source-isolation tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = main
          npm run check
      - name: Authenticate previous 18 owner-sealed truths and original HEAD bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/c2-run20"
          repo=cardenaspiero255-lang/Ultra-Sentinel
          mkdir -p "$root/prior"
          gh api "/repos/$repo/actions/runs/39071144969" > "$root/prior-run.json"
          jq -e '.id == 39071144969 and
            .path == ".github/workflows/c2-run18-two-original-source-truths.yml" and
            .head_sha == "d7518026d6acb506de41e7f224571f6a1fe26214" and
            .head_branch == "main" and .status == "completed" and
            .conclusion == "success" and .actor.id == 322222186 and
            .repository.id == 1418338512' "$root/prior-run.json" >/dev/null
          gh api "/repos/$repo/actions/runs/39071144969/artifacts" > "$root/prior-artifacts.json"
          jq -e '[.artifacts[] | select(
            .id == 12115670408 and .name == "ultra-sentinel-c2-run18-two-original-source-truths" and
            .workflow_run.id == 39071144969 and .expired == false and
            .digest == "sha256:aa2d483e887b7b89bb44aca2537744233f9307ebb8f9e24236e2c813ddab5507"
          )] | length == 1' "$root/prior-artifacts.json" >/dev/null
          gh run download 39071144969 --repo "$repo" \
            --name ultra-sentinel-c2-run18-two-original-source-truths --dir "$root/prior"
          test -f "$root/prior/c2-run18-owner-source-truth.json"
          test "$(find "$root/prior" -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(find "$root/prior" -type l | wc -l)" -eq 0
          jq -e '.schema == "ultra-sentinel-c2-run18-owner-source-truth-seal/v1" and
            .presealDigest == "efb7da33efad947995f315621d42de2de9edace6d9b4e9e91cf4dd1aae12" and
            .ownerRunId == 39071144969 and (.labels | length) == 18 and
            .sourcePositiveLabels == 9 and .verifiedScopedNegativeLabels == 9 and
            .benchmarkScoredLabels == 0 and .tripleSPlusCertified == false' \
            "$root/prior/c2-run18-owner-source-truth.json" >/dev/null
          while IFS='|' read -r alias head blob size path; do
            gh api "/repos/cardenaspiero255-lang/gamehub-ultra/contents/$path?ref=$head" \
              > "$root/metadata.json"
            jq -e --arg name "$path" --arg sha "$blob" --argjson bytes "$size" '
              .type == "file" and .path == $name and .sha == $sha and
              .size == $bytes and .encoding == "base64"' "$root/metadata.json" >/dev/null
            jq -r .content "$root/metadata.json" | base64 --decode > "$root/$alias"
            test "$(git hash-object "$root/$alias")" = "$blob"
          done <<'ORIGINAL_FILES'
          152.kt|104b7dc33e4c0341cec3fca81e3c8fbe3625357f|ed936aa687b08cf8d964d54f9d88e68bb12344ec|4331|app/src/main/java/com/cardenaspiero255/gamehubultra/data/AiProfileProposalStore.kt
          152-caller|104b7dc33e4c0341cec3fca81e3c8fbe3625357f|5e747dd88469b7457269b1e2dc592af9cd439f46|49492|app/src/main/java/com/cardenaspiero255/gamehubultra/GameHubUltraApp.kt
          151.kt|9ad983576c16c6c34d59283979d83c69ede50dce|742e440004d51743e8e4b02c40171f951edfd125|11693|app/src/main/java/com/cardenaspiero255/gamehubultra/data/SessionCoachSessionStore.kt
          151-caller|9ad983576c16c6c34d59283979d83c69ede50dce|ef69341a61164bbd69832f26186e48582c1b3042|24489|app/src/main/java/com/cardenaspiero255/gamehubultra/session/SessionCoachMonitorService.kt
          ORIGINAL_FILES
          grep -Fq 'recordApplied = aiProfileProposalStore::recordApplied' "$root/152-caller"
          grep -Fq 'expectedSessionId = sessionId' "$root/151-caller"
          test "$(sha256sum "$root/152.kt" | cut -d' ' -f1)" = f06604f1bdd7bba80d060adac49d99d9edfb38234e47a91d2f861af3997435da
          test "$(sha256sum "$root/151.kt" | cut -d' ' -f1)" = d8dbd5fadac170ed7b36c844f2480a03185046f381f64fd30feee0d20c219a70
          rm -f "$root/prior-run.json" "$root/prior-artifacts.json" "$root/metadata.json" \
            "$root/152-caller" "$root/151-caller"
      - name: Enforce AppArmor and Bubblewrap networkless JVM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -qq \
            bubblewrap apparmor apparmor-utils apparmor-profiles
          src=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$src" && test ! -L "$src"
          sudo install -o root -g root -m 0644 "$src" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          test -x /usr/bin/bwrap
      - name: Replay unchanged original Kotlin plus counterfactual and mutation
        shell: bash
        run: |
          set -euo pipefail
          C2_OWNER_SANDBOX=1 bash scripts/c2-run20-owner-original-oracles.sh "$RUNNER_TEMP/c2-run20"
          test -s "$RUNNER_TEMP/c2-run20/152-witness.json"
          test -s "$RUNNER_TEMP/c2-run20/151-witness.json"
      - name: Emit exactly two distinct bounded source-behavior truths
        shell: bash
        env:
          OWNER_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          test "$OWNER_ACTOR_ID" = 322222186
          node - <<'NODE'
          'use strict';
          const fs=require('node:fs'),crypto=require('node:crypto');
          const {preseal}=require('./packages/quality-gates/c2-run20-source-truth.cjs');
          if(process.env.GITHUB_ACTIONS!=='true'||
             process.env.GITHUB_REPOSITORY!=='cardenaspiero255-lang/Ultra-Sentinel'||
             process.env.GITHUB_REF!=='refs/heads/main'||
             !/^\d+$/.test(process.env.GITHUB_RUN_ID||''))throw Error('C2_RUN20_OWNER_PROVENANCE_BLOCKED');
          const root=process.env.RUNNER_TEMP+'/c2-run20';
          const prior=JSON.parse(fs.readFileSync(root+'/prior/c2-run18-owner-source-truth.json','utf8'));
          const witnesses=[152,151].map(n=>JSON.parse(fs.readFileSync(root+'/'+n+'-witness.json','utf8')));
          const proposed=preseal({prior,witnesses});
          const receipt={...proposed,
            schema:'ultra-sentinel-c2-run20-owner-source-truth-seal/v1',
            status:'SOURCE_BEHAVIOR_TRUTH_PARTIAL',
            ownerRunId:Number(process.env.GITHUB_RUN_ID),
            witnessDigest:crypto.createHash('sha256').update(JSON.stringify(witnesses)).digest('hex'),
            sourceCIAuthenticated:true,benchmarkCertified:false,verdict:'TRUTH_CORPUS_INCOMPLETE'};
          fs.writeFileSync(root+'/c2-run20-owner-source-truth.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
          jq -e '.schema == "ultra-sentinel-c2-run20-owner-source-truth-seal/v1" and
            (.labels | length) == 20 and .labels[0].positive == true and
            .labels[1].positive == false and .sourcePositiveLabels == 10 and
            .verifiedScopedNegativeLabels == 10 and .neededAdditionalLabelsAtLeast == 100 and
            .benchmarkScoredLabels == 0 and .precision == null and .recall == null and
            .f1 == null and .fpNonRegressionVerified == false and
            .independentBlindHoldoutCertified == false and .tripleSPlusCertified == false and
            .sourceCIAuthenticated == true and .benchmarkCertified == false' \
            "$RUNNER_TEMP/c2-run20/c2-run20-owner-source-truth.json" >/dev/null
      - name: Preserve owner-sealed partial ledger; never model predictions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: ultra-sentinel-c2-run20-two-store-source-truths
          path: ${{ runner.temp }}/c2-run20/c2-run20-owner-source-truth.json
          retention-days: 14
          if-no-files-found: error
