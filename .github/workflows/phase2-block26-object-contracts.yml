name: Ultra Sentinel — Block 2.6 frozen object and numeric contracts on new public Kotlin originals
on:
  pull_request:
    paths:
      - packages/family-hunter/GenericJvmMetamorphicProbe.java
      - scripts/phase2-block26-object-eval.cjs
      - tests/unit/phase2-block26-object-eval.test.cjs
      - tests/fixtures/phase2-block26-object-contracts/**
      - docs/quality/PHASE2-BLOCK26-OBJECT-COHORT.json
      - .github/workflows/phase2-block26-object-contracts.yml
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frozen-original-predictions:
    if: >-
      github.event.repository.id == 1418338512 &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'cardenaspiero255-lang/Ultra-Sentinel' &&
        github.event.pull_request.user.id == 322222186) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor_id == '322222186'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Checkout frozen candidate without oracle or subsequent protocol changes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8c246fd285793350a2fa3ccc2dcaa4eeac052750
          path: frozen-engine
          persist-credentials: false
      - name: Checkout exact public original source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bmaslakov/kotlin-algorithm-club
          ref: a8fa9edf615d0498bd1d2e8328f72a180d345343
          path: original-club
          persist-credentials: false
      - name: Require existing namespace and cgroup isolation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -qq bubblewrap apparmor apparmor-utils apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile" && test ! -L "$profile"
          sudo install -o root -g root -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Authenticate pinned Kotlin compiler archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/octet-stream' /repos/JetBrains/kotlin/releases/assets/198150667 > "$RUNNER_TEMP/kotlin.zip"
          test "$(sha256sum "$RUNNER_TEMP/kotlin.zip" | cut -d' ' -f1)" = 0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a
          mkdir "$RUNNER_TEMP/kotlin"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/kotlin"
      - name: Require complete regression suite
        run: npm run check
      - name: Require actual frozen isolation boundary
        run: SENTINEL_REQUIRE_BLIND_BWRAP=1 node --test frozen-engine/tests/unit/generic-jvm-metamorphic-isolation.test.cjs
      - name: Authenticate original blobs and compile inside isolated bounded namespace
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node scripts/phase2-block26-object-eval.cjs prepare "$GITHUB_WORKSPACE/frozen-engine" "$GITHUB_WORKSPACE/original-club" "$RUNNER_TEMP/source-only"
          mkdir "$RUNNER_TEMP/compiled" "$RUNNER_TEMP/probe" "$RUNNER_TEMP/predictions"
          bash tests/fixtures/phase2-block26-object-contracts/run-isolated.sh compile "$RUNNER_TEMP/kotlin/kotlinc" "$RUNNER_TEMP/source-only" "$RUNNER_TEMP/compiled"
          javac -d "$RUNNER_TEMP/probe" frozen-engine/packages/family-hunter/GenericJvmMetamorphicProbe.java
      - name: Execute frozen Hunter with original bytecode only and seal predictions
        shell: bash
        run: |
          set -euo pipefail
          bash frozen-engine/tests/fixtures/jvm-metamorphic/run-probe.sh "$RUNNER_TEMP/compiled/target.jar" "$RUNNER_TEMP/probe" io.uuddlrlrba.ktalgs "$RUNNER_TEMP/predictions"
          node scripts/phase2-block26-object-eval.cjs seal "$RUNNER_TEMP/predictions/discovery.json" "$RUNNER_TEMP/compiled/target.jar" "$RUNNER_TEMP/predictions/prediction-seal.json"
          node scripts/phase2-block26-object-eval.cjs verify "$RUNNER_TEMP/predictions/prediction-seal.json" "$RUNNER_TEMP/predictions/discovery.json"
          cat "$RUNNER_TEMP/predictions/prediction-seal.json"
      - name: Publish sealed predictions BEFORE independent oracle execution
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: block26-object-frozen-original-predictions
          path: ${{ runner.temp }}/predictions/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve compiler and execution failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: block26-object-capture-diagnostics
          path: |
            ${{ runner.temp }}/compiled/diagnostics.log
            ${{ runner.temp }}/compiled/execution.log
          if-no-files-found: ignore
          retention-days: 30
  independent-original-oracle:
    needs: frozen-original-predictions
    if: >-
      github.event.repository.id == 1418338512 &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'cardenaspiero255-lang/Ultra-Sentinel' &&
        github.event.pull_request.user.id == 322222186) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor_id == '322222186'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Checkout frozen candidate without oracle or subsequent protocol changes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8c246fd285793350a2fa3ccc2dcaa4eeac052750
          path: frozen-engine
          persist-credentials: false
      - name: Checkout exact public original source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bmaslakov/kotlin-algorithm-club
          ref: a8fa9edf615d0498bd1d2e8328f72a180d345343
          path: original-club
          persist-credentials: false
      - name: Require existing namespace and cgroup isolation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -qq bubblewrap apparmor apparmor-utils apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile" && test ! -L "$profile"
          sudo install -o root -g root -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Authenticate pinned Kotlin compiler archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/octet-stream' /repos/JetBrains/kotlin/releases/assets/198150667 > "$RUNNER_TEMP/kotlin.zip"
          test "$(sha256sum "$RUNNER_TEMP/kotlin.zip" | cut -d' ' -f1)" = 0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a
          mkdir "$RUNNER_TEMP/kotlin"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/kotlin"
      - name: Download prior immutable predictions
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: block26-object-frozen-original-predictions
          path: ${{ runner.temp }}/sealed
      - name: Verify prior predictions then compile and execute independent original oracle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node scripts/phase2-block26-object-eval.cjs verify "$RUNNER_TEMP/sealed/prediction-seal.json" "$RUNNER_TEMP/sealed/discovery.json"
          node scripts/phase2-block26-object-eval.cjs prepare "$GITHUB_WORKSPACE/frozen-engine" "$GITHUB_WORKSPACE/original-club" "$RUNNER_TEMP/independent-input"
          mkdir "$RUNNER_TEMP/independent-input/oracle" "$RUNNER_TEMP/oracle-compiled" "$RUNNER_TEMP/oracle-output"
          cp tests/fixtures/phase2-block26-object-contracts/IndependentArithmeticOracle.kt "$RUNNER_TEMP/independent-input/oracle/IndependentArithmeticOracle.kt"
          bash tests/fixtures/phase2-block26-object-contracts/run-isolated.sh compile "$RUNNER_TEMP/kotlin/kotlinc" "$RUNNER_TEMP/independent-input" "$RUNNER_TEMP/oracle-compiled"
          bash tests/fixtures/phase2-block26-object-contracts/run-isolated.sh oracle "$RUNNER_TEMP/kotlin/kotlinc" "$RUNNER_TEMP/oracle-compiled" "$RUNNER_TEMP/oracle-output"
          node scripts/phase2-block26-object-eval.cjs verdict "$RUNNER_TEMP/sealed/prediction-seal.json" "$RUNNER_TEMP/sealed/discovery.json" "$RUNNER_TEMP/oracle-output/execution.log" "$RUNNER_TEMP/oracle-output/verdict.json"
      - name: Preserve independent observations and diagnostics, including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: block26-object-independent-original-oracle
          path: |
            ${{ runner.temp }}/oracle-output/
            ${{ runner.temp }}/oracle-compiled/diagnostics.log
            ${{ runner.temp }}/oracle-compiled/execution.log
          if-no-files-found: error
          retention-days: 30
