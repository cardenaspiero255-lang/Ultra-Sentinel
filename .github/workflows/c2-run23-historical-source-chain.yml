name: Ultra Sentinel C2 Run23 verified historic cause audit
on:
  pull_request:
    paths:
      - .github/workflows/c2-run23-historical-source-chain.yml
      - packages/quality-gates/c2-run23-chain-audit.cjs
      - tests/unit/c2-run23-chain-audit.test.cjs
      - scripts/audit-c2-run23-chain.cjs
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: c2-run23-causal-provenance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  audit-owner-run23-truth:
    if: >-
      github.event.repository.id == 1418338512 &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'cardenaspiero255-lang/Ultra-Sentinel') ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' && github.actor_id == '322222186'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Sentinel without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify unit regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm run check
      - name: Authenticate original owner Run22 and Run23 GitHub API and download original receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/c2-run23-chain"
          repo=cardenaspiero255-lang/Ultra-Sentinel
          mkdir -p "$root/prior" "$root/latest"
          gh api "/repos/$repo/actions/runs/39076132177" > "$root/run22.json"
          gh api "/repos/$repo/actions/runs/39077240648" > "$root/run23.json"
          jq -e '.id==39076132177 and .path==".github/workflows/c2-run22-original-comparison-freshness.yml" and
            .head_sha=="0633de8fec9e06c0249dae8e64cf127dba01b7ae" and
            .event=="issue_comment" and .actor.id==322222186 and
            .repository.id==1418338512 and .head_branch=="main" and
            .status=="completed" and .conclusion=="success"' "$root/run22.json" >/dev/null
          jq -e '.id==39077240648 and .path==".github/workflows/c2-run23-two-original-store-truths.yml" and
            .head_sha=="1c60224e114bb34b75f6268088b86e136fd378c0" and
            .event=="issue_comment" and .actor.id==322222186 and
            .repository.id==1418338512 and .head_branch=="main" and
            .status=="completed" and .conclusion=="success"' "$root/run23.json" >/dev/null
          gh api "/repos/$repo/actions/runs/39076132177/artifacts" > "$root/run22-artifacts.json"
          gh api "/repos/$repo/actions/runs/39077240648/artifacts" > "$root/run23-artifacts.json"
          jq -e '[.artifacts[]|select(.id==12117067167 and
            .name=="ultra-sentinel-c2-run22-original-comparison-freshness-positive" and
            .digest=="sha256:7a77bdc5b53c18c24f87de5c754d094f008639020da1a31fbd67ae5815bf16cc" and
            .expired==false and .workflow_run.id==39076132177 and
            .workflow_run.repository_id==1418338512)]|length==1' "$root/run22-artifacts.json" >/dev/null
          jq -e '[.artifacts[]|select(.id==12117128918 and
            .name=="ultra-sentinel-c2-run23-two-store-source-truths" and
            .digest=="sha256:31ea72b3231fe73fb97e815ff70d88f3a5ddeb1d7fd7a3324584de9b7fbe3400" and
            .expired==false and .workflow_run.id==39077240648 and
            .workflow_run.repository_id==1418338512)]|length==1' "$root/run23-artifacts.json" >/dev/null
          gh run download 39076132177 --repo "$repo" \
            --name ultra-sentinel-c2-run22-original-comparison-freshness-positive --dir "$root/prior"
          gh run download 39077240648 --repo "$repo" \
            --name ultra-sentinel-c2-run23-two-store-source-truths --dir "$root/latest"
          test "$(find "$root/prior" -maxdepth 1 -type f|wc -l)" -eq 2
          test "$(find "$root/latest" -maxdepth 1 -type f|wc -l)" -eq 3
          test "$(find "$root/prior" "$root/latest" -type l|wc -l)" -eq 0
          test -s "$root/prior/c2-run22-owner-source-truth.json"
          test -s "$root/latest/c2-run23-owner-source-truth.json"
          test -s "$root/latest/152-witness.json"
          test -s "$root/latest/151-witness.json"
          rm -f "$root/run22.json" "$root/run23.json" \
            "$root/run22-artifacts.json" "$root/run23-artifacts.json"
      - name: Verify eight original GameHub Git commit trees and label blob identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/c2-run23-chain"
          mkdir -p "$root/tree-input"
          node -e "process.stdout.write(JSON.stringify(require('./packages/quality-gates/c2-next-holdout.cjs').NEW_LOCK.cases))" > "$root/cases.json"
          jq -r '.[]|[.pr,.headSha]|@tsv' "$root/cases.json" | while IFS=$'\t' read -r pr head; do
            gh api "/repos/cardenaspiero255-lang/gamehub-ultra/git/commits/$head" > "$root/tree-input/$pr-commit.json"
            jq -e --arg sha "$head" '.sha==$sha and (.tree.sha|type)=="string"' \
              "$root/tree-input/$pr-commit.json" >/dev/null
            tree_sha="$(jq -r '.tree.sha' "$root/tree-input/$pr-commit.json")"
            gh api "/repos/cardenaspiero255-lang/gamehub-ultra/git/trees/$tree_sha?recursive=1" > "$root/tree-input/$pr-tree.json"
            jq -e --arg sha "$tree_sha" '.sha==$sha and .truncated==false and (.tree|type=="array")' \
              "$root/tree-input/$pr-tree.json" >/dev/null
            jq -n --argjson pr "$pr" --arg head "$head" \
              --slurpfile c "$root/tree-input/$pr-commit.json" \
              --slurpfile t "$root/tree-input/$pr-tree.json" \
              '{pr:$pr,headSha:$head,treeSha:$c[0].tree.sha,truncated:$t[0].truncated,
              blobs:[$t[0].tree[]|select(.type=="blob")|{path,sha}]}' > "$root/tree-input/$pr-manifest.json"
          done
          test "$(find "$root/tree-input" -name '*-manifest.json' -type f|wc -l)" -eq 8
          jq -s '.' "$root/tree-input/"*-manifest.json > "$root/source-trees.json"
          test "$(jq 'length' "$root/source-trees.json")" -eq 8
          rm -rf "$root/tree-input" "$root/cases.json"
      - name: Reconcile original labels without reading detector predictions
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/c2-run23-chain"
          node scripts/audit-c2-run23-chain.cjs \
            "$root/prior/c2-run22-owner-source-truth.json" \
            "$root/latest/c2-run23-owner-source-truth.json" \
            "$root/latest/152-witness.json" "$root/latest/151-witness.json" \
            "$root/source-trees.json" \
            "$root/c2-run23-causal-audit.json"
          jq -e '.schema=="ultra-sentinel-c2-run23-historical-source-chain-audit/v1" and
            .sourceBlobsVerified==23 and .count==23 and .positives==11 and
            .negatives==12 and .newLabels==0 and
            .historicalEvidenceAuthenticated==false and
            .independenceVerified==false and .holdoutFrozen==false and
            .precision==null and .recall==null and .f1==null and
            .tripleSPlusCertified==false' "$root/c2-run23-causal-audit.json" >/dev/null
          # Keep only sanitized derived metadata; never archive raw source, witness or Git trees.
          mkdir -p "$RUNNER_TEMP/c2-run23-public-evidence"
          cp "$root/c2-run23-causal-audit.json" \
             "$RUNNER_TEMP/c2-run23-public-evidence/c2-run23-causal-audit.json"
      - name: Archive sanitized historical inventory with no original source
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c2-run23-source-provenance-causal-audit
          path: ${{ runner.temp }}/c2-run23-public-evidence/c2-run23-causal-audit.json
          retention-days: 14
          if-no-files-found: warn
