name: Ultra Sentinel — C2 original math and voice source truth
# Owner-only, source behavior without detector scoring, training or automatic repair.
on:
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
concurrency:
  group: ultra-sentinel-c2-run18-owner-evidence
  cancel-in-progress: false
jobs:
  attest-run18-source:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.repository.id == 1418338512 &&
      ((github.event_name == 'workflow_dispatch' && github.actor_id == '322222186') ||
       (github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.issue.number == 50 &&
        github.event.issue.pull_request == null &&
        github.event.comment.body == 'ULTRA_SENTINEL_C2_RUN18_MATH_VOICE_TRUTH_V1' &&
        github.event.comment.user.id == 322222186 &&
        github.event.sender.id == 322222186))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main with no stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run all code and evidence tests on main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = main
          npm run check
      - name: Authenticate prior owner run and Git original Kotlin + callsites
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/c2-run18"
          repo=cardenaspiero255-lang/Ultra-Sentinel
          mkdir -p "$root/prior"
          gh api "/repos/$repo/actions/runs/39070029033" > "$root/prior-run.json"
          jq -e '.id == 39070029033 and
            .path == ".github/workflows/c2-run17-original-source-truth.yml" and
            .head_sha == "df5cbcd63e1267c4356f70bf66d5384315c96662" and
            .head_branch == "main" and .status == "completed" and .conclusion == "success" and
            .actor.id == 322222186 and .repository.id == 1418338512' "$root/prior-run.json" >/dev/null
          gh api "/repos/$repo/actions/runs/39070029033/artifacts" > "$root/old-artifacts.json"
          jq -e '[.artifacts[] | select(
            .id == 12114598638 and
            .name == "ultra-sentinel-c2-run17-original-source-truth" and
            .workflow_run.id == 39070029033 and .expired == false and
            .digest == "sha256:bc2cd5da189f39bed41c02737b1b73cf5df17bc0f938be9094bcf4e87377f764"
          )] | length == 1' "$root/old-artifacts.json" >/dev/null
          gh run download 39070029033 --repo "$repo" \
            --name ultra-sentinel-c2-run17-original-source-truth --dir "$root/prior"
          test -f "$root/prior/c2-run17-owner-source-truth.json"
          test "$(find "$root/prior" -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(find "$root/prior" -type l | wc -l)" -eq 0
          jq -e '.schema == "ultra-sentinel-c2-run17-owner-source-truth-seal/v1" and
            .presealDigest == "6bac3d64f843455c3f95728404ad53b25ece0748f1ed5c0e5439ae5a8cea97d4" and
            .ownerRunId == 39070029033 and (.labels|length) == 16 and
            .sourcePositiveLabels == 8 and .verifiedScopedNegativeLabels == 8 and
            .benchmarkScoredLabels == 0 and .tripleSPlusCertified == false' \
            "$root/prior/c2-run17-owner-source-truth.json" >/dev/null
          while IFS='|' read -r alias head blob size path; do
            gh api "/repos/cardenaspiero255-lang/gamehub-ultra/contents/$path?ref=$head" \
              > "$root/original-metadata.json"
            jq -e --arg p "$path" --arg s "$blob" --argjson n "$size" '
              .type == "file" and .path == $p and .sha == $s and
              .size == $n and .encoding == "base64"' "$root/original-metadata.json" >/dev/null
            jq -r .content "$root/original-metadata.json" | base64 --decode > "$root/$alias"
            test "$(git hash-object "$root/$alias")" = "$blob"
          done <<'FROZEN_INPUTS'
          154.kt|858c9ce5cb6a7916d63f2348432013e49d02ba79|063787d48784fd9b579e2c9a4d5ad4bbd7ab9d7a|36551|app/src/main/java/com/cardenaspiero255/gamehubultra/ai/UltraMathEngine.kt
          154-caller|858c9ce5cb6a7916d63f2348432013e49d02ba79|5d271a02aa4227e07a5c352b572f6c14621e80fc|21944|app/src/main/java/com/cardenaspiero255/gamehubultra/ai/UltraUnifiedAgent.kt
          150.kt|4c6912d7ca17df0669f8a0d9667f34d2f2b205a9|f661289c8fb9d5ca59687f156923971f4cc4672d|7932|app/src/main/java/com/cardenaspiero255/gamehubultra/voice/UltraWakePlaybackGuard.kt
          150-caller|4c6912d7ca17df0669f8a0d9667f34d2f2b205a9|cb23014c91b447bef2eeb7b619503495d31a55da|16874|app/src/main/java/com/cardenaspiero255/gamehubultra/voice/UltraWakeService.kt
          150-parser|4c6912d7ca17df0669f8a0d9667f34d2f2b205a9|febd1687ceb26a9f195413021fb0257392c0592b|19917|app/src/main/java/com/cardenaspiero255/gamehubultra/voice/VoiceCommandParser.kt
          FROZEN_INPUTS
          test "$(sha256sum "$root/154.kt" | cut -d' ' -f1)" = f9fbdbd7aabd2dffbadc4b04b31280779bd7359624c081b9e64d532d8c40f65a
          test "$(sha256sum "$root/150.kt" | cut -d' ' -f1)" = b3147996af60bb304f65c400ca535ee07ad828921d0df870f9117d19422f49dc
          grep -Fq 'UltraMathEngine.solve(transcript)' "$root/154-caller"
          grep -Fq 'UltraWakeBargeInPolicy.decide(' "$root/150-caller"
          grep -Fq 'UltraWakeRecognitionDisposition.STOP_TTS -> return stopActiveUltraSpeech(' "$root/150-caller"
          grep -Fq 'internal fun normalize(value: String): String =' "$root/150-parser"
          grep -Fq 'internal fun stripLeadingAssistantInvocation(value: String): String =' "$root/150-parser"
          rm -f "$root/prior-run.json" "$root/old-artifacts.json" "$root/original-metadata.json" \
            "$root/154-caller" "$root/150-caller" "$root/150-parser"
      - name: Require AppArmor and Bubblewrap sandbox
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -qq \
            bubblewrap apparmor apparmor-utils apparmor-profiles
          src=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$src" && test ! -L "$src"
          sudo install -o root -g root -m 0644 "$src" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          test -x /usr/bin/bwrap
      - name: Execute original and mutant Kotlin without network
        shell: bash
        run: |
          set -euo pipefail
          C2_OWNER_SANDBOX=1 bash scripts/c2-run18-owner-original-oracles.sh "$RUNNER_TEMP/c2-run18"
          test -s "$RUNNER_TEMP/c2-run18/154-witness.json"
          test -s "$RUNNER_TEMP/c2-run18/150-witness.json"
      - name: Record exactly two bounded original-source truths, no benchmark
        shell: bash
        env:
          OWNER_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          test "$OWNER_ACTOR_ID" = 322222186
          node - <<'NODE'
          'use strict';
          const fs=require('node:fs'),crypto=require('node:crypto');
          const {presealRun18}=require('./packages/quality-gates/c2-run18-original-two-truths.cjs');
          if(process.env.GITHUB_ACTIONS!=='true'||
             process.env.GITHUB_REPOSITORY!=='cardenaspiero255-lang/Ultra-Sentinel'||
             process.env.GITHUB_REF!=='refs/heads/main'||
             !/^\d+$/.test(process.env.GITHUB_RUN_ID||''))throw Error('C2_RUN18_OWNER_BLOCKED');
          const root=process.env.RUNNER_TEMP+'/c2-run18';
          const prior=JSON.parse(fs.readFileSync(root+'/prior/c2-run17-owner-source-truth.json','utf8'));
          const witnesses=[154,150].map(n=>JSON.parse(fs.readFileSync(root+'/'+n+'-witness.json','utf8')));
          const preseal=presealRun18({prior,witnesses});
          const receipt={...preseal,
            schema:'ultra-sentinel-c2-run18-owner-source-truth-seal/v1',
            status:'SOURCE_BEHAVIOR_TRUTH_PARTIAL',ownerRunId:Number(process.env.GITHUB_RUN_ID),
            witnessDigest:crypto.createHash('sha256').update(JSON.stringify(witnesses)).digest('hex'),
            sourceCIAuthenticated:true,benchmarkCertified:false,verdict:'TRUTH_CORPUS_INCOMPLETE'};
          fs.writeFileSync(root+'/c2-run18-owner-source-truth.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
          jq -e '.schema == "ultra-sentinel-c2-run18-owner-source-truth-seal/v1" and
            (.labels|length)==18 and .labels[0].positive==true and .labels[1].positive==false and
            .sourcePositiveLabels==9 and .verifiedScopedNegativeLabels==9 and
            .neededAdditionalLabelsAtLeast==102 and .benchmarkScoredLabels==0 and
            .precision==null and .recall==null and .f1==null and
            .fpNonRegressionVerified==false and .tripleSPlusCertified==false and
            .sourceCIAuthenticated==true and .benchmarkCertified==false' \
            "$RUNNER_TEMP/c2-run18/c2-run18-owner-source-truth.json" >/dev/null
      - name: Archive source-truth receipt only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: ultra-sentinel-c2-run18-two-original-source-truths
          path: ${{ runner.temp }}/c2-run18/c2-run18-owner-source-truth.json
          retention-days: 14
          if-no-files-found: error
