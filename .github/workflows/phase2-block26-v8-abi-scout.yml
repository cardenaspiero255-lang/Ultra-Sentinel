name: Ultra Sentinel — Block 2.6 v8 structural JVM ABI scout before cohort commit
on:
  pull_request:
    paths:
      - .github/workflows/phase2-block26-v8-abi-scout.yml
      - scripts/phase2-kotlin-api-v8-abi-scout.cjs
      - docs/quality/PHASE2-BLOCK26-V8-POOL.json
      - docs/quality/PHASE2-BLOCK26-V8-POOL-SEAL.json
      - tests/unit/phase2-block26-v8-pool-seal.test.cjs
      - tests/unit/phase2-block26-v8-structural-diversity.test.cjs
      - packages/quality-gates/v8-structural-diversity.cjs
permissions:
  contents: read
jobs:
  structural-abi-before-cohort:
    if: >-
      github.event.repository.id == 1418338512 &&
      github.event.pull_request.head.repo.full_name == 'cardenaspiero255-lang/Ultra-Sentinel' &&
      github.event.pull_request.user.id == 322222186
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact trusted v8 host with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pin Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Pin JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Checkout SHA-frozen corrected Hunter v7 (never edit target)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 689583c23277807345edb715d8c2d277a3d4bda7
          path: frozen-v7-engine
          persist-credentials: false
      - name: Require full regression suite and SHA-sealed metadata pool
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node --test tests/unit/phase2-block26-v8-pool-seal.test.cjs tests/unit/phase2-block26-v8-structural-diversity.test.cjs
      - name: Measure structural decision lines and branches (no coverage waivers)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-test-coverage \
            --test-coverage-include=packages/quality-gates/v8-structural-diversity.cjs \
            --test-coverage-lines=90 --test-coverage-branches=90 \
            --test tests/unit/phase2-block26-v8-structural-diversity.test.cjs
      - name: Require real Bubblewrap/AppArmor/cgroup kernel isolation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -qq bubblewrap apparmor apparmor-utils apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile" && test ! -L "$profile"
          sudo install -o root -g root -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          SENTINEL_JVM_V2_RUNNER=1 SENTINEL_REQUIRE_BLIND_BWRAP=1 node --test tests/unit/generic-jvm-metamorphic-isolation.test.cjs
      - name: Fetch and authenticate SHA256-pinned Kotlin compiler 2.0.21
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kotlin-compiler-2.0.21.zip"
          gh api -H 'Accept: application/octet-stream' /repos/JetBrains/kotlin/releases/assets/198150667 > "$archive"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = 0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a
          mkdir "$RUNNER_TEMP/kotlin-v8"
          unzip -q "$archive" -d "$RUNNER_TEMP/kotlin-v8"
      - name: Compile pinned original Kotlin only in sandbox and read public JVM declarations
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          node scripts/phase2-kotlin-api-v8-abi-scout.cjs \
            "$GITHUB_WORKSPACE/frozen-v7-engine" \
            "$RUNNER_TEMP/kotlin-v8/kotlinc" \
            "$RUNNER_TEMP/v8-scout-work" "$RUNNER_TEMP/v8-abi-report"
          test -s "$RUNNER_TEMP/v8-abi-report/abi-result.json"
          test -s "$RUNNER_TEMP/v8-abi-report/abi-seal.json"
      - name: Preserve original structural outcomes, including zero coverage or abstentions
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: block26-v8-prospective-abi-scout
          path: ${{ runner.temp }}/v8-abi-report/
          if-no-files-found: warn
          retention-days: 90
