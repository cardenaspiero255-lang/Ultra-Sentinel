name: Ultra Sentinel — GameHub provider observer (read-only)
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "GameHub PR number (read-only)"
        required: true
        default: "201"
  schedule:
    - cron: '41 */6 * * *'
permissions:
  contents: read
concurrency:
  group: gamehub-providers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  observe:
    name: Collect CodeRabbit/Qodo/Sentry evidence (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout trusted main, never a PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Read immutable GameHub PR evidence without write access
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ inputs.pr_number || '201' }}
        run: node scripts/gamehub-provider-observer.cjs "$TARGET_PR"
