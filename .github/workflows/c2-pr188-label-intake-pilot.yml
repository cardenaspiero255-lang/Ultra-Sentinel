name: Ultra Sentinel C2 PR188 authenticated 106-case label intake pilot
on:
  pull_request:
    paths:
      - .github/workflows/c2-pr188-label-intake-pilot.yml
      - packages/quality-gates/c2-pr188-label-intake-priority.cjs
      - scripts/c2-pr188-build-label-intake.cjs
      - tests/unit/c2-pr188-label-intake-priority.test.cjs
      - docs/quality/C2-PR188-LABEL-INTAKE-PILOT.md
permissions:
  contents: read
jobs:
  authenticated-label-intake-plan:
    if: >-
      github.event.repository.id == 1418338512 &&
      github.event.pull_request.head.repo.full_name == 'cardenaspiero255-lang/Ultra-Sentinel'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Unit and structure regression checks
        run: npm run check
      - name: Produce authenticated 106 source intake with a 16-case pilot and no label promotions
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/c2-pr188"
          mkdir -p "$root"
          node scripts/c2-pr188-build-label-intake.cjs "$root/label-intake.json"
          jq -e '
            .schema=="c2-pr188-prioritized-106-public-kotlin-source-intake/v1" and
            .sourceRepository=="Kotlin/kotlin-swe-bench" and
            .sourceCommit=="b9025d86f7ae634901396766bd61f6d4ae6d2165" and
            .sourceTasksTreeSha=="7e6c0a3c10c8f082b8f7a9c5efbcc51c360356a9" and
            .candidatesTotal==106 and .uniqueRepositories==9 and
            (.pilot|length)==16 and (.remaining|length)==90 and
            ([.pilot[].task,.remaining[].task]|unique|length)==106 and
            ([.pilot[]|select(.repository=="detekt/detekt")]|length)==6 and
            ([.pilot[]|select(.repository=="pinterest/ktlint")]|length)==3 and
            .existingHistoricalLabels==23 and .additionalTargetLowerBound==97 and
            .newLabels==0 and .independentCausesCertified==0 and
            .blindHoldout==false and .tripleSPlusCertified==false and
            .precision==null and .recall==null and .f1==null and
            .publicBenchmarkDisclosure=="REVEALED_NOT_BLIND" and
            ([.pilot[],.remaining[]]|all(.groundTruthAdmitted==false and
              .blindHoldoutEligible==false and .sourceOriginalVerified==false and
              .causesIndependentlyCertified==false and .licenseVerified==false))' \
            "$root/label-intake.json" >/dev/null
          jq -c '.pilot[]|{order,task,repository,reproductionStatus,groundTruthAdmitted}' "$root/label-intake.json"
      - name: Archive source candidate plan, not labels or runtime test receipts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c2-pr188-pinned-public-kotlin-106-prioritized-candidates-not-gold
          path: ${{ runner.temp }}/c2-pr188/label-intake.json
          retention-days: 30
          if-no-files-found: error
