name: Ultra Sentinel — rollback remoto JARVIS #105 con aprobación GitHub
# Independent owner issue_comment + GitHub OIDC; NO automatic repair/rollback.
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  id-token: write
concurrency:
  group: ultra-owner-remote-jarvis-transaction
  cancel-in-progress: false
jobs:
  verify-owner-remote-rollback:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.repository.id == 1418338512 &&
      github.actor == 'cardenaspiero255-lang' &&
      github.actor_id == '322222186' &&
      github.event.sender.id == 322222186 &&
      github.event.comment.user.id == 322222186 &&
      github.event.issue.number == 50 &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, 'ULTRA_SENTINEL_REMOTE_ROLLBACK_V1|') &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify owner rollback authorization contract and exact protected code SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/main
          node --test tests/unit/github-remote-owner-rollback.test.cjs tests/unit/github-remote-rollback-workflow.test.cjs
      - name: Verify independent GitHub OIDC signature, live nonce and exact JARVIS repair tree
        shell: bash
        env:
          ULTRA_OWNER_COMMENT_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/verify-remote-jarvis-rollback-workflow.cjs
          node - "$RUNNER_TEMP/owner-remote-rollback-approval-receipt.json" <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(p.status!=='GITHUB_REMOTE_ROLLBACK_OWNER_VERIFIED'||
             p.prNumber!==105||p.rollbackAuthorized!==true||
             p.nonceReplayBlocked!==true||p.authenticatedLiveSource!==true||
             p.remoteWrites!==false||p.mergeAllowed!==false||
             p.requiresSeparateWriteExecutor!==true)process.exit(1);
          NODE
      - name: Reverify owner OIDC and perform separately allowed draft rollback
        if: success() && vars.ULTRA_SENTINEL_GITHUB_REMOTE_ROLLBACK_ENABLED == 'true'
        shell: bash
        env:
          ULTRA_OWNER_COMMENT_READ_TOKEN: ${{ github.token }}
          ULTRA_SENTINEL_JARVIS_OWNER_TOKEN: ${{ secrets.ULTRA_SENTINEL_JARVIS_OWNER_TOKEN }}
          ULTRA_SENTINEL_REMOTE_ROLLBACK_APPLY: ${{ vars.ULTRA_SENTINEL_REMOTE_ROLLBACK_APPLY }}
          ULTRA_SENTINEL_REMOTE_ROLLBACK_APPLY_CONFIRMED: ${{ vars.ULTRA_SENTINEL_REMOTE_ROLLBACK_APPLY_CONFIRMED }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/run-github-owner-jarvis-rollback.cjs
      - name: Archive sanitized restore proof only after a verified rollback
        if: >-
          success() &&
          vars.ULTRA_SENTINEL_GITHUB_REMOTE_ROLLBACK_ENABLED == 'true' &&
          vars.ULTRA_SENTINEL_REMOTE_ROLLBACK_APPLY == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: owner-jarvis-remote-tree-restoration
          path: ${{ runner.temp }}/owner-github-rollback-result.json
          retention-days: 7
          if-no-files-found: error
      - name: Archive read-only bounded rollback authorization
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: owner-jarvis-rollback-approval-no-write
          path: ${{ runner.temp }}/owner-remote-rollback-approval-receipt.json
          retention-days: 7
          if-no-files-found: error
