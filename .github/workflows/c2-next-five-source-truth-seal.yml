name: Ultra Sentinel — C2 five immutable original-source truth cases
# Source-oracle receipts only. No candidate or baseline access, no writes to repository.
on:
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
concurrency:
  group: ultra-sentinel-c2-five-source-truth
  cancel-in-progress: false
jobs:
  verify-and-seal-five-source-cases:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.repository.id == 1418338512 &&
      ((github.event_name == 'workflow_dispatch' && github.actor_id == '322222186') ||
       (github.event_name == 'issue_comment' &&
        github.event.action == 'created' && github.event.issue.number == 50 &&
        github.event.issue.pull_request == null &&
        github.event.comment.body == 'ULTRA_SENTINEL_C2_NEXT_FIVE_SOURCE_TRUTH_V1' &&
        github.event.comment.user.id == 322222186 &&
        github.event.sender.id == 322222186))
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout trusted main without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check all tests and contracts at original witness truth verifier HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = main
          npm run check
      - name: Authenticate immutable owner source runs and archive SHA256 digests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          repo=cardenaspiero255-lang/Ultra-Sentinel
          root="$RUNNER_TEMP/c2-five-real-originals"
          mkdir -p "$root/previous" "$root/new"
          chmod 0700 "$root" "$root/previous" "$root/new"
          for id in 38947142683 38968765586; do
            gh api "/repos/$repo/actions/runs/$id" > "$root/run-$id.json"
            jq -e --argjson id "$id" '.id == $id and
              .event == "issue_comment" and .status == "completed" and
              .conclusion == "success" and .head_branch == "main" and
              .repository.id == 1418338512 and .actor.id == 322222186' \
              "$root/run-$id.json" >/dev/null
            gh api "/repos/$repo/actions/runs/$id/artifacts" > "$root/artifacts-$id.json"
          done
          jq -e '.path == ".github/workflows/c2-next-four-scoped-truth-seal.yml" and
            .head_sha == "cf59dd917ef05187500db9785c2e2ef339e5978c"' \
            "$root/run-38947142683.json" >/dev/null
          jq -e '.path == ".github/workflows/c2-next-pr151-nonfinite-headroom.yml" and
            .head_sha == "2d2132806c37148655ece20ef209fcaeceb9f002"' \
            "$root/run-38968765586.json" >/dev/null
          jq -e '[.artifacts[]|select(
            .id == 12065927799 and
            .name == "ultra-sentinel-c2-four-source-scoped-truth" and
            .workflow_run.id == 38947142683 and
            .digest == "sha256:7f3b231da9b665c3b19067efbbf686618cb854fe7f377904a9b8b1d59f5a7738" and
            .expired == false)]|length == 1' "$root/artifacts-38947142683.json" >/dev/null
          jq -e '[.artifacts[]|select(
            .id == 12075688473 and
            .name == "ultra-sentinel-c2-next-pr151-original-nonfinite-witness" and
            .workflow_run.id == 38968765586 and
            .digest == "sha256:43c3e02ff1965341e04cb616e625252d2ad42319244b04c5ca8238307caa8138" and
            .expired == false)]|length == 1' "$root/artifacts-38968765586.json" >/dev/null
          gh run download 38947142683 --repo "$repo" \
            --name ultra-sentinel-c2-four-source-scoped-truth --dir "$root/previous"
          gh run download 38968765586 --repo "$repo" \
            --name ultra-sentinel-c2-next-pr151-original-nonfinite-witness --dir "$root/new"
          test "$(find "$root/previous" -maxdepth 1 -type f|wc -l)" -eq 1
          test "$(find "$root/new" -maxdepth 1 -type f|wc -l)" -eq 1
          test "$(find "$root/previous" "$root/new" -type l|wc -l)" -eq 0
          test -f "$root/previous/c2-four-bounded-source-truth.json"
          test -f "$root/new/c2-pr151-witness.json"
          rm -f "$root"/run-*.json "$root"/artifacts-*.json
      - name: Seal five original-source labels in isolated offline Node verifier
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/c2-five-real-originals"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" NODE_NO_WARNINGS=1 \
            node --experimental-permission \
            --allow-fs-read="$GITHUB_WORKSPACE/scripts/seal-c2-next-five-original-truth.cjs" \
            --allow-fs-read="$GITHUB_WORKSPACE/packages/quality-gates/c2-next-five-source-truth.cjs" \
            --allow-fs-read="$GITHUB_WORKSPACE/packages/quality-gates/c2-next-four-scoped-truth.cjs" \
            --allow-fs-read="$GITHUB_WORKSPACE/packages/quality-gates/c2-next-two-original-truth.cjs" \
            --allow-fs-read="$GITHUB_WORKSPACE/packages/quality-gates/c2-next-one-positive-truth.cjs" \
            --allow-fs-read="$GITHUB_WORKSPACE/packages/quality-gates/c2-next-holdout.cjs" \
            --allow-fs-read="$root/previous/c2-four-bounded-source-truth.json" \
            --allow-fs-read="$root/new/c2-pr151-witness.json" \
            "$GITHUB_WORKSPACE/scripts/seal-c2-next-five-original-truth.cjs" \
            "$root/previous/c2-four-bounded-source-truth.json" \
            "$root/new/c2-pr151-witness.json" \
            > "$RUNNER_TEMP/c2-five-source-truth.json"
          jq -e '.schema == "ultra-sentinel-c2-next-five-original-source-truth-seal/v1" and
            (.labels|length) == 5 and
            .labels[0].pr == 151 and .labels[0].positive == true and
            .labels[1].pr == 152 and .labels[1].positive == true and
            .labels[2].pr == 153 and .labels[2].positive == true and
            .labels[3].pr == 157 and .labels[3].positive == false and
            .labels[4].pr == 158 and .labels[4].positive == false and
            .sourcePositiveLabels == 3 and .verifiedScopedNegativeLabels == 2 and
            .verifiedNegativeFindingLabels == 2 and .benchmarkScoredLabels == 0 and
            .neededAdditionalPositiveLabelsAtLeast == 45 and
            .neededAdditionalNegativeLabelsAtLeast == 46 and
            .neededAdditionalLabelsAtLeast == 115 and
            .includesPredictions == false and .includesBaseline == false and
            .precision == null and .recall == null and .f1 == null and
            .fpNonRegressionVerified == false and .tripleSPlusCertified == false and
            .verdict == "TRUTH_CORPUS_INCOMPLETE"' "$RUNNER_TEMP/c2-five-source-truth.json" >/dev/null
          cat "$RUNNER_TEMP/c2-five-source-truth.json"
      - name: Archive only minimized SHA-linked partial truth
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: ultra-sentinel-c2-next-five-source-truth
          path: ${{ runner.temp }}/c2-five-source-truth.json
          if-no-files-found: error
          retention-days: 14
