          archive="$RUNNER_TEMP/kotlin-compiler-2.0.21.zip"
          gh api -H 'Accept: application/octet-stream' /repos/JetBrains/kotlin/releases/assets/198150667 > "$archive"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = 0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a
          mkdir "$RUNNER_TEMP/kotlin-v2"
          unzip -q "$archive" -d "$RUNNER_TEMP/kotlin-v2"
      - name: Require real adversarial isolation before discovery
        run: SENTINEL_JVM_V2_RUNNER=1 SENTINEL_REQUIRE_BLIND_BWRAP=1 node --test tests/unit/generic-jvm-metamorphic-isolation.test.cjs
      - name: Authenticate untouched sources and capture frozen hypotheses without oracle mounts
        shell: bash
        run: |
          set -euo pipefail
          node tests/fixtures/phase2-kotlin-api-v2/capture.cjs \
            docs/quality/PHASE2-KOTLIN-API-V2-COHORT.json "$GITHUB_WORKSPACE/frozen-v2-engine" \
            "$GITHUB_WORKSPACE/originals" "$RUNNER_TEMP/kotlin-v2/kotlinc" \
            "$RUNNER_TEMP/v2-hunter-work" "$RUNNER_TEMP/v2-predictions"
      - name: Publish immutable predictions before independent oracle job
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: block26-kotlin-api-v2-predictions
          path: ${{ runner.temp }}/v2-predictions
          retention-days: 90
          if-no-files-found: error
