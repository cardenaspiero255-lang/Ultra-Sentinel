name: Ultra Sentinel — prospective frozen KMP Hunter and independent JVM oracle
on:
  pull_request:
    paths:
      - docs/quality/PHASE2-NEW-KMP-PROSPECTIVE-FREEZE-20261112.json
      - scripts/phase2-kmp-frozen-capture.sh
      - tests/fixtures/phase2-frozen-kmp-20261112/**
      - tests/unit/phase2-kmp-frozen-prospective.test.cjs
      - .github/workflows/phase2-new-kmp-prospective.yml
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frozen-kmp-independent-evaluation:
    if: >-
      github.event.repository.id == 1418338512 &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'cardenaspiero255-lang/Ultra-Sentinel' &&
        github.event.pull_request.user.id == 322222186) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        github.actor_id == '322222186'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact precommitted evaluation protocol
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Test full project before any original-source work
        run: npm run check
      - name: Checkout immutable expanded Hunter SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cardenaspiero255-lang/Ultra-Sentinel
          ref: ce2c030fde3465ee4c3203022fee2c09c2233f59
          path: frozen-engine
          persist-credentials: false
      - name: Checkout previously unseen original AtomicFU
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kotlin/kotlinx-atomicfu
          ref: 063dd3c8e9b8bd8b7fc2a7e897c3f6eeb2c9a428
          path: reserved-atomicfu
          persist-credentials: false
      - name: Checkout previously unseen original Compose resources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: JetBrains/compose-multiplatform
          ref: 8431de3fdab6251ce5a0d7ab07303f5c85b13827
          path: reserved-compose
          persist-credentials: false
      - name: Enforce Bubblewrap namespace and AppArmor
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -qq bubblewrap apparmor apparmor-utils apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile" && test ! -L "$profile"
          sudo install -o root -g root -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Verify real networkless source-worker isolation
        run: |
          SENTINEL_REQUIRE_BLIND_BWRAP=1 node --test frozen-engine/tests/unit/phase2-blind-isolation-boundary.test.cjs
          SENTINEL_REQUIRE_BLIND_BWRAP=1 node --test frozen-engine/tests/unit/phase2-blind-numeric-isolation.test.cjs
      - name: Run nine immutable source-only workers without oracle or answer mounts
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/kmp-frozen-sealed"
          bash scripts/phase2-kmp-frozen-capture.sh \
            "$GITHUB_WORKSPACE/frozen-engine" \
            "$GITHUB_WORKSPACE/reserved-atomicfu" \
            "$GITHUB_WORKSPACE/reserved-compose" \
            "$RUNNER_TEMP/kmp-frozen-sealed"
          jq -e '.originalKotlinFiles==38 and (.reports|length)==9 and
            .scored==false and .truePositives==null and
            .falsePositives==null and .falseNegatives==null' \
            "$RUNNER_TEMP/kmp-frozen-sealed/source-only-seal.json" >/dev/null
      - name: Fetch and authenticate Kotlin 2.0.21 toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/kotlin-2.0.21.zip"
          gh api -H 'Accept: application/octet-stream' /repos/JetBrains/kotlin/releases/assets/198150667 > "$zip"
          test "$(sha256sum "$zip" | cut -d' ' -f1)" = 0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a
          mkdir "$RUNNER_TEMP/kotlin-frozen"
          unzip -q "$zip" -d "$RUNNER_TEMP/kotlin-frozen"
      - name: Compile immutable original plural Kotlin sources inside a no-network namespace
        shell: bash
        run: |
          set -euo pipefail
          jdk="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          mounts=(--ro-bind /usr /usr)
          for mount in /bin /lib /lib64; do
            if [ -L "$mount" ]; then
              target="$(readlink "$mount")"
              [[ "$target" != /* && "$target" != *..* ]] || exit 2
              mounts+=(--symlink "$target" "$mount")
            elif [ -d "$mount" ]; then mounts+=(--ro-bind "$mount" "$mount")
            else exit 2; fi
          done
          mkdir -m 700 "$RUNNER_TEMP/compiled-original"
          timeout --kill-after=3s 120s env -i PATH=/usr/bin:/bin HOME=/tmp /usr/bin/bwrap \
            --die-with-parent --unshare-all --new-session --clearenv \
            --setenv PATH /kotlin/bin:/jdk/bin:/usr/bin:/bin \
            --setenv JAVA_HOME /jdk --setenv HOME /tmp \
            ${mounts[@]} --ro-bind "$jdk" /jdk \
            --ro-bind "$RUNNER_TEMP/kotlin-frozen/kotlinc" /kotlin \
            --ro-bind "$GITHUB_WORKSPACE/reserved-compose" /source \
            --bind "$RUNNER_TEMP/compiled-original" /out \
            --tmpfs /tmp --proc /proc --dev /dev --dir /home --chdir /tmp -- \
            /kotlin/bin/kotlinc -jvm-target 17 -include-runtime \
              /source/components/resources/library/src/commonMain/kotlin/org/jetbrains/compose/resources/plural/PluralRule.kt \
              /source/components/resources/library/src/commonMain/kotlin/org/jetbrains/compose/resources/plural/PluralCategory.kt \
              -d /out/untouched-plural.jar
          test -s "$RUNNER_TEMP/compiled-original/untouched-plural.jar"
      - name: Run frozen cgroup-bounded generic JVM method probe before seeing oracle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/probe-classes"
          javac -d "$RUNNER_TEMP/probe-classes" frozen-engine/packages/family-hunter/GenericJvmMetamorphicProbe.java
          mkdir -m 700 "$RUNNER_TEMP/probe-output"
          bash frozen-engine/tests/fixtures/jvm-metamorphic/run-probe.sh \
            "$RUNNER_TEMP/compiled-original/untouched-plural.jar" \
            "$RUNNER_TEMP/probe-classes" org.jetbrains.compose.resources.plural \
            "$RUNNER_TEMP/probe-output"
          jq -e '.sourceAuthenticated==false and .oracleVerified==false and
            .novelFamilyVerified==false and .remoteWrites==false and .mergeAllowed==false' \
            "$RUNNER_TEMP/probe-output/discovery.json" >/dev/null
          cp "$RUNNER_TEMP/probe-output/discovery.json" "$RUNNER_TEMP/kmp-frozen-sealed/jvm-method-probe.json"
          ( cd "$RUNNER_TEMP/kmp-frozen-sealed" && sha256sum *.json > SHA256SUMS.txt )
          echo 'FROZEN_SOURCE_AND_METHOD_PREDICTIONS_SEALED_BEFORE_ORACLE'
      - name: Upload raw immutable source and JVM predictions BEFORE any oracle execution
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: phase2-kmp-original-unscored-predictions
          path: ${{ runner.temp }}/kmp-frozen-sealed/
          retention-days: 30
          if-no-files-found: error
      - name: Run independent precommitted original Kotlin RED GREEN wrong-patch VETO after sealing
        shell: bash
        run: |
          set -euo pipefail
          jdk="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          node_root="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          mounts=(--ro-bind /usr /usr)
          for mount in /bin /lib /lib64; do
            if [ -L "$mount" ]; then
              target="$(readlink "$mount")"
              [[ "$target" != /* && "$target" != *..* ]] || exit 2
              mounts+=(--symlink "$target" "$mount")
            elif [ -d "$mount" ]; then mounts+=(--ro-bind "$mount" "$mount")
            else exit 2; fi
          done
          mkdir -m 700 "$RUNNER_TEMP/kmp-verdict"
          timeout --kill-after=3s 180s env -i PATH=/usr/bin:/bin HOME=/tmp /usr/bin/bwrap \
            --die-with-parent --unshare-all --new-session --clearenv \
            --setenv PATH /kotlin/bin:/jdk/bin:/node/bin:/usr/bin:/bin \
            --setenv JAVA_HOME /jdk --setenv HOME /tmp --setenv RUNNER_TEMP /tmp \
            ${mounts[@]} --ro-bind "$jdk" /jdk --ro-bind "$node_root" /node \
            --ro-bind "$RUNNER_TEMP/kotlin-frozen/kotlinc" /kotlin \
            --ro-bind "$GITHUB_WORKSPACE" /sentinel \
            --ro-bind "$RUNNER_TEMP/kmp-frozen-sealed" /predictions \
            --bind "$RUNNER_TEMP/kmp-verdict" /verdict \
            --tmpfs /tmp --proc /proc --dev /dev --dir /home --chdir /sentinel -- \
            /bin/bash /sentinel/tests/fixtures/phase2-frozen-kmp-20261112/reproduce.sh \
              /sentinel/reserved-compose /kotlin /sentinel /predictions /verdict \
            | tee "$RUNNER_TEMP/kmp-original-oracle.log"
          grep -Fxq 'SCOPED_CLDR_ORIGINAL_JVM_RED_GREEN_WRONG_PATCH_VETO_PASS' "$RUNNER_TEMP/kmp-original-oracle.log"
      - name: Publish original Kotlin oracle verdict separately
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: phase2-kmp-original-independent-oracle-verdict
          path: |
            ${{ runner.temp }}/kmp-verdict/original-oracle-verdict.json
            ${{ runner.temp }}/kmp-original-oracle.log
          retention-days: 30
          if-no-files-found: error
