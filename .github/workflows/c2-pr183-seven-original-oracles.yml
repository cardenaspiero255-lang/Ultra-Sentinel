name: Ultra Sentinel C2 PR183 seven original Kotlin counterfactual replays
on:
  pull_request:
    paths:
      - .github/workflows/c2-pr183-seven-original-oracles.yml
      - scripts/c2-pr183-campaign.cjs
      - packages/quality-gates/c2-pr183-seven-original-oracles.cjs
      - tests/unit/c2-pr183-seven-original-oracles.test.cjs
      - docs/quality/C2-PR183-SEVEN-ORIGINAL-REPLAYS.md
permissions:
  contents: read
  actions: read
jobs:
  regression:
    if: >-
      github.event.repository.id == 1418338512 &&
      github.event.pull_request.head.repo.full_name == 'cardenaspiero255-lang/Ultra-Sentinel'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm run check
  replay:
    needs: regression
    strategy:
      fail-fast: false
      matrix:
        suite: [json, presentation, battery-local, thermal-session, comparison]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Retrieve exact historical Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/c2-pr183/$SUITE"
          mkdir -p "$root/output"
          node scripts/c2-pr183-campaign.cjs manifest "$SUITE" > "$root/source-list.tsv"
          count=0
          while IFS='|' read -r alias head blob path sha;do
            test -n "$alias"
            gh api "/repos/cardenaspiero255-lang/gamehub-ultra/contents/$path?ref=$head" > "$root/metadata.json"
            jq -e --arg b "$blob" --arg p "$path" '
              .type=="file" and .sha==$b and .path==$p and
              .encoding=="base64" and .size>100 and .size<1000000' "$root/metadata.json" >/dev/null
            jq -r .content "$root/metadata.json" | base64 --decode > "$root/$alias"
            test "$(git hash-object "$root/$alias")" = "$blob"
            if [ "$sha" != '-' ];then
              test "$(sha256sum "$root/$alias" | cut -d' ' -f1)" = "$sha"
            fi
            count=$((count + 1))
          done < "$root/source-list.tsv"
          test "$count" -ge 1
          rm "$root/metadata.json" "$root/source-list.tsv"
          echo "C2_PR183_PINNED_ORIGINAL_SOURCES_FETCHED=$SUITE:$count"
      - name: Enforce no-network AppArmor/Bubblewrap JVM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -qq \
            bubblewrap apparmor apparmor-utils apparmor-profiles
          src=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$src" && test ! -L "$src"
          sudo install -o root -g root -m 0644 "$src" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          command -v bwrap >/dev/null
          command -v kotlinc >/dev/null
      - name: Execute original JVM behavior and sensitivity counterfactual
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/c2-pr183/$SUITE"
          case "$SUITE" in
            json) script=c2-pr152-owner-oracle.sh;;
            presentation) script=c2-run16-owner-negative-oracles.sh;;
            battery-local) script=c2-run17-owner-original-oracles.sh;;
            thermal-session) script=c2-run21-original-negative-oracles.sh;;
            comparison) script=c2-run22-original-comparison-oracle.sh;;
            *) exit 2;;
          esac
          C2_OWNER_SANDBOX=1 bash "scripts/$script" "$root"
          node scripts/c2-pr183-campaign.cjs suite "$SUITE" "$root" "$root/output/proof.json"
          test -s "$root/output/proof.json"
      - name: Upload scoped evidence, never original fetched source or JAR
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: c2-pr183-${{ matrix.suite }}
          path: ${{ runner.temp }}/c2-pr183/${{ matrix.suite }}/output/proof.json
          retention-days: 14
          if-no-files-found: error
  consolidate:
    needs: [regression,replay]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Authenticate parent five-replay report from merged PR182
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/c2-pr183/summary"
          mkdir -p "$root/prior" "$root/output"
          repo=cardenaspiero255-lang/Ultra-Sentinel
          gh api "/repos/$repo/actions/runs/39717303301" > "$root/run.json"
          jq -e '.id==39717303301 and
            .head_sha=="8088b456902c45500530ed9f117d176763958523" and
            .path==".github/workflows/c2-pr181-adversarial-original-causal-probes.yml" and
            .event=="pull_request" and .status=="completed" and
            .conclusion=="success" and .actor.id==322222186 and
            .repository.id==1418338512' "$root/run.json" >/dev/null
          gh api "/repos/$repo/actions/runs/39717303301/artifacts" > "$root/artifacts.json"
          jq -e '[.artifacts[]|select(
            .id==12399373117 and
            .name=="c2-pr181-source-scoped-causal-probes-not-certified" and
            .digest=="sha256:36d3f54b3444e4b6e331e504999171ee303c9a59331dd518f56db3f91b53ed8a" and
            .expired==false and .workflow_run.id==39717303301)]|length==1' "$root/artifacts.json" >/dev/null
          gh run download 39717303301 --repo "$repo" \
            --name c2-pr181-source-scoped-causal-probes-not-certified --dir "$root/prior"
          test "$(find "$root/prior" -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(find "$root/prior" -type l | wc -l)" -eq 0
          test -s "$root/prior/pr181-source-scoped-adjudication.json"
          rm -f "$root/run.json" "$root/artifacts.json"
      - name: Download all five independent current-run receipts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: c2-pr183-*
          path: ${{ runner.temp }}/c2-pr183/summary/stages
          merge-multiple: false
      - name: Fail closed and consolidate exact 12 originals, zero cause admissions
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/c2-pr183/summary"
          node scripts/c2-pr183-campaign.cjs combine \
            "$root/prior/pr181-source-scoped-adjudication.json" \
            "$root/output/pr183-twelve-source-replays.json" \
            "$root/stages/c2-pr183-json/proof.json" \
            "$root/stages/c2-pr183-presentation/proof.json" \
            "$root/stages/c2-pr183-battery-local/proof.json" \
            "$root/stages/c2-pr183-thermal-session/proof.json" \
            "$root/stages/c2-pr183-comparison/proof.json"
          jq -e '
            .schema=="c2-pr183-twelve-original-kotlin-replays-not-causally-certified/v1" and
            .status=="TWELVE_ORIGINAL_SOURCES_REPLAYED_CAUSAL_FAMILY_INDEPENDENCE_PENDING" and
            .originalReceipts==12 and .retestedPositive==6 and .retestedNegative==6 and
            .remainingWithoutSourceReplay==0 and
            ([.entryReviews[]|select(.originalSourceReplayed==true)]|length)==12 and
            .certifiedIndependentCausesAdded==0 and .newLabels==0 and
            .causalFamilyIndependenceVerified==false and
            .sourceLabels==23 and .sourcePositiveLabels==11 and .sourceNegativeLabels==12 and
            .sssPlusCertified==false and .holdoutFrozen==false and
            .precision==null and .recall==null and .f1==null and
            ([.entryReviews[]|select(.causalFingerprint!=null or
              .independentRootCauseCertified!=false or .eligibleForGold!=false)]|length)==0
          ' "$root/output/pr183-twelve-source-replays.json" >/dev/null
          jq -c '.entryReviews[]|{pr,line,positive,originalSourceReplayed,causalIndependenceStatus}' \
            "$root/output/pr183-twelve-source-replays.json"
      - name: Archive only reconciled source-behavior attestation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: c2-pr183-all-twelve-original-source-replays-not-certified
          path: ${{ runner.temp }}/c2-pr183/summary/output/pr183-twelve-source-replays.json
          retention-days: 14
          if-no-files-found: error
