name: Ultra Sentinel — Phase 2 Block 2.5b datetime original oracle SHA256 precommit
on:
  pull_request:
    paths:
      - tests/fixtures/phase2-block25b-oracle/**
      - scripts/phase2-block25b-oracle-preflight.cjs
      - tests/unit/phase2-block25b-oracle-preflight.test.cjs
      - docs/quality/PHASE2-BLOCK25B-DATETIME-ORACLES.md
      - .github/workflows/phase2-block25b-oracle-preregister.yml
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pinned-v3-source-and-unexecuted-datetime-oracles:
    if: >-
      github.event.repository.id == 1418338512 &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'cardenaspiero255-lang/Ultra-Sentinel' &&
        github.event.pull_request.user.id == 322222186) ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/main' && github.actor_id == '322222186'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate SHA with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Full repository contracts and previous frozen engine integrity
        run: |
          npm run check
          node scripts/verify-phase2-block21-freeze.cjs
      - name: Checkout immutable and already frozen Hunter v2 commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cardenaspiero255-lang/Ultra-Sentinel
          ref: 49235f854c61c29d55a0307ce4a0348553b2ee1f
          path: frozen-hunter-v3
          persist-credentials: false
      - name: Checkout distinct original six-file Kotlin IO cohort
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kotlin/kotlinx-datetime
          ref: 77c95cc8125015f83ea8fd900404c295fba7276e
          path: reserved-kotlin-datetime
          persist-credentials: false
      - name: Authenticate exact external Git blobs and oracle SHA256 precommit WITHOUT invoking Hunter
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node scripts/phase2-block25b-source-attest.cjs \
            "$GITHUB_WORKSPACE/frozen-hunter-v3" "$GITHUB_WORKSPACE/reserved-kotlin-datetime" \
            "$RUNNER_TEMP/block25b-original-source-attestation.json"
          node scripts/phase2-block25b-oracle-preflight.cjs \
            "$GITHUB_WORKSPACE/frozen-hunter-v3" "$GITHUB_WORKSPACE/reserved-kotlin-datetime" \
            "$RUNNER_TEMP/block25b-source-attestation.json"
          jq -e '.originalKotlinSourcesAuthenticated==6 and
            .independentOracleFilesSha256Authenticated==2 and
            .originalKotlinSourceControlsPrepared==3 and
            .actualOriginalPositiveDefectsVerified==false and
            .fullyLabeledOriginalFiles==0 and
            .predictionsExecuted==false and .oraclesExecuted==false and
            .precision==null and .recall==null and .f1==null and
            .remoteWrites==false and .repairAuthorized==false and .mergeAllowed==false' \
            "$RUNNER_TEMP/block25b-source-attestation.json" >/dev/null
      - name: JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and enforce Bubblewrap AppArmor namespace
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -qq bubblewrap apparmor apparmor-utils apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile" && test ! -L "$profile"
          sudo install -o root -g root -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Fetch and byte-authenticate pinned Kotlin 2.0.21 compiler
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/kotlin-2.0.21.zip"
          gh api -H 'Accept: application/octet-stream' /repos/JetBrains/kotlin/releases/assets/198150667 > "$zip"
          test "$(sha256sum "$zip" | cut -d' ' -f1)" = 0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a
          mkdir "$RUNNER_TEMP/block25b-kotlin"
          unzip -q "$zip" -d "$RUNNER_TEMP/block25b-kotlin"
      - name: Compile two untouched original Kotlin JVM contracts in no-network namespace WITHOUT executing oracles
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          jdk="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          mounts=(--ro-bind /usr /usr)
          for mount in /bin /lib /lib64; do
            if [ -L "$mount" ]; then
              target="$(readlink "$mount")"
              [[ "$target" != /* && "$target" != *..* ]] || exit 2
              mounts+=(--symlink "$target" "$mount")
            elif [ -d "$mount" ]; then mounts+=(--ro-bind "$mount" "$mount")
            else exit 2; fi
          done
          mkdir -m 700 "$RUNNER_TEMP/block25b-compiled"
          common=(--die-with-parent --unshare-all --new-session --clearenv
            --setenv PATH /kotlin/bin:/jdk/bin:/usr/bin:/bin
            --setenv JAVA_HOME /jdk --setenv HOME /tmp
            "${mounts[@]}" --ro-bind "$jdk" /jdk
            --ro-bind "$RUNNER_TEMP/block25b-kotlin/kotlinc" /kotlin
            --ro-bind "$GITHUB_WORKSPACE/reserved-kotlin-datetime" /source
            --ro-bind "$GITHUB_WORKSPACE/tests/fixtures/phase2-block25b-oracle" /oracle
            --bind "$RUNNER_TEMP/block25b-compiled" /out
            --tmpfs /tmp --proc /proc --dev /dev --dir /home --chdir /tmp)
          timeout --kill-after=3s 180s env -i PATH=/usr/bin:/bin HOME=/tmp /usr/bin/bwrap "${common[@]}" -- \
            /kotlin/bin/kotlinc -jvm-target 17 -include-runtime \
            /source/core/common/src/internal/BinaryDataReader.kt \
            /oracle/BinaryReaderOracle.kt -d /out/binary-original.jar
          timeout --kill-after=3s 180s env -i PATH=/usr/bin:/bin HOME=/tmp /usr/bin/bwrap "${common[@]}" -- \
            /kotlin/bin/kotlinc -jvm-target 17 -include-runtime \
            /source/core/common/src/internal/dateCalculations.kt \
            /source/core/common/src/internal/util.kt \
            /oracle/CalendarOracle.kt -d /out/calendar-original.jar
          test -s "$RUNNER_TEMP/block25b-compiled/binary-original.jar"
          test -s "$RUNNER_TEMP/block25b-compiled/calendar-original.jar"
          ( cd "$RUNNER_TEMP/block25b-compiled" && sha256sum *.jar > "$RUNNER_TEMP/block25b-compiled-sha256.txt" )
          printf '%s\n' "ORIGINAL_DATETIME_ORACLES_COMPILED_NOT_EXECUTED" > "$RUNNER_TEMP/block25b-oracle-status.txt"
      - name: Upload original source authentication and unexecuted oracle precommit evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: phase2-block25b-datetime-original-oracles-precommitted-unexecuted
          path: |
            ${{ runner.temp }}/block25b-original-source-attestation.json
            ${{ runner.temp }}/block25b-source-attestation.json
            ${{ runner.temp }}/block25b-compiled-sha256.txt
            ${{ runner.temp }}/block25b-oracle-status.txt
          if-no-files-found: warn
          retention-days: 30
