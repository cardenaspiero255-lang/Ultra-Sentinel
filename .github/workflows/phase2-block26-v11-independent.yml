name: Ultra Sentinel — Block 2.6 V11 independent post-seal original oracle adjudication
on:
  pull_request:
    paths:
      - .github/workflows/phase2-block26-v11-independent.yml
      - docs/quality/PHASE2-BLOCK26-V11-ORACLE-COMMITMENT.json
      - docs/quality/PHASE2-BLOCK26-V11-INDEPENDENT-ADJUDICATION-RECEIPT.json
      - tests/fixtures/phase2-block26-v11/oracle/**
      - scripts/phase2-block26-v11-independent-judge.cjs
      - scripts/phase2-block26-v11-independent-run.cjs
      - tests/unit/phase2-block26-v11-independent-adjudication.test.cjs
permissions:
  contents: read
  actions: read
jobs:
  independent-original-oracles-after-sealed-v11-hunter:
    if: >-
      github.event.repository.id == 1418338512 &&
      github.event.pull_request.head.repo.full_name == 'cardenaspiero255-lang/Ultra-Sentinel' &&
      github.event.pull_request.user.id == 322222186
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact SHA of precommitted independent oracle
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pin Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Pin JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Checkout immutable source of Hunter and networkless runner (not executed again)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 689583c23277807345edb715d8c2d277a3d4bda7
          path: frozen-v7-engine
          persist-credentials: false
      - name: Checkout immutable original 1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: runetopic/cryptography
          ref: 26094b76f87acb7692eeaaa10df51f1c6f3542ac
          path: originals/source-1
          persist-credentials: false
      - name: Checkout immutable original 2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SebastianAigner/dhash-kotlin
          ref: fa6949247ac8bd44c0ad4b750d2af8d72d4fc4da
          path: originals/source-2
          persist-credentials: false
      - name: Validate precommitted oracle, TDD and full baseline before downloading predictions
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node --test tests/unit/phase2-block26-v11-independent-adjudication.test.cjs
          node --check scripts/phase2-block26-v11-independent-run.cjs
          node --check scripts/phase2-block26-v11-independent-judge.cjs
      - name: Demand actual AppArmor, Bubblewrap and bounded cgroups
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -qq bubblewrap apparmor apparmor-utils apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile" && test ! -L "$profile"
          sudo install -o root -g root -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          SENTINEL_JVM_V2_RUNNER=1 SENTINEL_REQUIRE_BLIND_BWRAP=1 node --test tests/unit/generic-jvm-metamorphic-isolation.test.cjs
      - name: Download checksum pinned Kotlin 2.0.21 before original code runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kotlin-compiler-2.0.21.zip"
          gh api -H 'Accept: application/octet-stream' /repos/JetBrains/kotlin/releases/assets/198150667 > "$archive"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = 0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a
          mkdir "$RUNNER_TEMP/kotlin-original-v11"
          unzip -q "$archive" -d "$RUNNER_TEMP/kotlin-original-v11"
      - name: Retrieve ORIGINAL previously sealed Hunter predictions AFTER oracle source commitment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/v11-previous-sealed-predictions"
          gh run download 44317152922 --repo cardenaspiero255-lang/Ultra-Sentinel --name block26-v11-full-frozen-hunter-predictions --dir "$RUNNER_TEMP/v11-previous-sealed-predictions"
          test -s "$RUNNER_TEMP/v11-previous-sealed-predictions/full-prediction-seal.json"
          test "$(sha256sum "$RUNNER_TEMP/v11-previous-sealed-predictions/full-prediction-seal.json" | cut -d' ' -f1)" = 0ccfa2c2cd51536f5a2bbecf624b6054fe05c0db06b4f5e04b598e480853737d
      - name: Reauthenticate original SHA-sealed reports and run ONLY independent isolated oracle
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          node scripts/phase2-block26-v11-independent-run.cjs \
            "$GITHUB_WORKSPACE/frozen-v7-engine" "$GITHUB_WORKSPACE/originals" \
            "$RUNNER_TEMP/kotlin-original-v11/kotlinc" \
            "$RUNNER_TEMP/v11-independent-work" "$RUNNER_TEMP/v11-independent-verdict" \
            "$RUNNER_TEMP/v11-previous-sealed-predictions"
          test -s "$RUNNER_TEMP/v11-independent-verdict/independent-truth.json"
          test -s "$RUNNER_TEMP/v11-independent-verdict/independent-verdict.json"
      - name: Retain authenticated positive, negative or incomplete verdict
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: block26-v11-independent-original-verdict
          path: ${{ runner.temp }}/v11-independent-verdict/
          if-no-files-found: warn
          retention-days: 90
