name: Ultra Sentinel — blind original Kotlin consent-window oracle
on:
  pull_request:
    paths:
      - packages/investigation/plain-kotlin-payload.cjs
      - packages/investigation/novel-kotlin-path-policy.cjs
      - packages/family-hunter/phase2-codec-integrity-hunter.cjs
      - packages/family-hunter/phase2-blind-codec-worker.cjs
      - packages/recovery/phase2-codec-integrity-candidate.cjs
      - tests/unit/phase2-codec-integrity-hunter.test.cjs
      - tests/unit/phase2-codec-integrity-candidate.test.cjs
      - tests/unit/phase2-codec-blind-integration.test.cjs
      - tests/fixtures/gamehub-codec/**
      - packages/family-hunter/phase2-numeric-risk-hunter.cjs
      - packages/family-hunter/blind-numeric-worker.cjs
      - tests/unit/phase2-blind-numeric-worker.test.cjs
      - tests/unit/phase2-blind-numeric-git-inventory.test.cjs
      - tests/unit/phase2-blind-numeric-receipt.test.cjs
      - tests/unit/phase2-blind-numeric-isolation.test.cjs
      - tests/fixtures/gamehub-blind-numeric/**
      - packages/family-hunter/phase2-numeric-semantic-evidence.cjs
      - packages/family-hunter/phase2-numeric-sealed-semantic-link.cjs
      - tests/unit/phase2-numeric-sealed-semantic-link.test.cjs
      - tests/unit/phase2-numeric-sealed-link-cli.test.cjs
      - tests/fixtures/gamehub-three-source/verify-numeric-link.cjs
      - packages/kotlin-semantic/C2NumericSemanticClaims.kt
      - tests/unit/phase2-numeric-semantic-evidence.test.cjs
      - tests/fixtures/gamehub-three-source/verify-numeric-semantic.cjs
      - tests/fixtures/gamehub-three-source/reproduce.sh
      - tests/unit/phase2-numeric-risk-hunter.test.cjs
      - tests/unit/phase2-numeric-original-bridge.test.cjs
      - tests/fixtures/gamehub-three-source/scan-numeric.cjs
      - packages/quality-gates/phase2-causal-factorial.cjs
      - tests/unit/phase2-causal-factorial.test.cjs
      - packages/recovery/phase2-generic-jvm-judge.cjs
      - packages/recovery/phase2-executed-jvm-triplet.cjs
      - tests/unit/phase2-executed-jvm-triplet.test.cjs
      - tests/unit/phase2-generic-jvm-judge.test.cjs
      - packages/memory/phase2-signed-revocation-filter.cjs
      - tests/unit/phase2-signed-revocation-filter.test.cjs
      - packages/memory/memory-local-revocation-journal.cjs
      - tests/unit/memory-local-revocation-journal.test.cjs
      - packages/memory/memory-signed-checkpoint.cjs
      - tests/unit/memory-signed-checkpoint.test.cjs
      - packages/memory/ultra_sentinel_memory_quarantine.cjs
      - tests/unit/memory-signed-quarantine-integration.test.cjs
      - tests/unit/memory-witness-quarantine-integration.test.cjs
      - tests/unit/phase2-cross-oracle-trigger.test.cjs
      - .github/workflows/phase2-control-plane-coverage.yml
      - packages/family-hunter/blind-elapsed-window.cjs
      - packages/family-hunter/blind-hunter-worker.cjs
      - packages/recovery/elapsed-window-candidate.cjs
      - tests/unit/blind-elapsed-window.test.cjs
      - tests/unit/blind-git-inventory.test.cjs
      - tests/unit/phase2-blind-isolation-boundary.test.cjs
      - tests/fixtures/jarvis-elapsed-window/**
      - .github/workflows/phase2-blind-elapsed-original-oracle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blind-original-consent-oracle:
    if: >-
      github.event.repository.id == 1418338512 &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'cardenaspiero255-lang/Ultra-Sentinel' &&
        github.event.pull_request.user.id == 322222186) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        github.actor_id == '322222186'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Ultra Sentinel without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Require tested blind Hunter and Fixer (90% lines and branches)
        run: |
          set -euo pipefail
          node --test --experimental-test-coverage \
            --test-coverage-include=packages/family-hunter/blind-elapsed-window.cjs \
            --test-coverage-include=packages/recovery/elapsed-window-candidate.cjs \
            --test-coverage-lines=90 --test-coverage-branches=90 \
            tests/unit/blind-elapsed-window.test.cjs
      - name: Require 90 percent coverage for blind inventory and Hunter worker
        run: |
          set -euo pipefail
          node --test --experimental-test-coverage \
            --test-coverage-include=tests/fixtures/jarvis-elapsed-window/prepare-blind-inventory.cjs \
            --test-coverage-lines=90 --test-coverage-branches=90 \
            tests/unit/blind-git-inventory.test.cjs
          node --test --experimental-test-coverage \
            --test-coverage-include=packages/family-hunter/blind-hunter-worker.cjs \
            --test-coverage-lines=90 --test-coverage-branches=90 \
            tests/unit/blind-git-inventory.test.cjs
      - name: Verify architecture and complete unit suite
        run: npm run check
      - name: Set up JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Require 90 percent executed JVM bridge coverage
        run: |
          set -euo pipefail
          node --test --experimental-test-coverage \
            --test-coverage-include=packages/recovery/phase2-executed-jvm-triplet.cjs \
            --test-coverage-lines=90 --test-coverage-branches=90 \
            tests/unit/phase2-executed-jvm-triplet.test.cjs
      - name: Fetch and authenticate Kotlin 2.0.21
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          archive="$RUNNER_TEMP/kotlin-compiler-2.0.21.zip"
          gh api -H 'Accept: application/octet-stream' /repos/JetBrains/kotlin/releases/assets/198150667 > "$archive"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = 0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a
          mkdir "$RUNNER_TEMP/kotlin-blind"
          unzip -q "$archive" -d "$RUNNER_TEMP/kotlin-blind"
      - name: Checkout pinned original JARVIS without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cardenaspiero255-lang/JARVIS
          ref: 747c14b5d97750a7b2736968e2d516f02448558d
          path: original-jarvis
          persist-credentials: false
      - name: Require real Bubblewrap and enforced AppArmor
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -qq bubblewrap apparmor apparmor-utils apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile" && test ! -L "$profile"
          sudo install -o root -g root -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Require real blind namespace adversarial probe
        run: SENTINEL_REQUIRE_BLIND_BWRAP=1 node --test tests/unit/phase2-blind-isolation-boundary.test.cjs
      - name: Prepare source-only inventory from pinned JARVIS Git objects
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node tests/fixtures/jarvis-elapsed-window/prepare-blind-inventory.cjs \
            "$GITHUB_WORKSPACE/original-jarvis" 747c14b5d97750a7b2736968e2d516f02448558d \
            apps/android/app/src/main/java/com/cardenaspiero255/jarvis/core \
            "$RUNNER_TEMP/blind-inventory.json"
          mkdir -m 700 "$RUNNER_TEMP/blind-hunter-output"
      - name: Run Hunter before exposing the original oracle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          bash tests/fixtures/jarvis-elapsed-window/run-blind-hunter.sh \
            "$RUNNER_TEMP/blind-inventory.json" \
            "$GITHUB_WORKSPACE/packages/family-hunter/blind-elapsed-window.cjs" \
            "$GITHUB_WORKSPACE/packages/family-hunter/blind-hunter-worker.cjs" \
            "$RUNNER_TEMP/blind-hunter-output" > "$RUNNER_TEMP/blind-original-kotlin.log" 2>&1
          chmod 400 "$RUNNER_TEMP/blind-hunter-output/discovery.json"
          sha256sum "$RUNNER_TEMP/blind-hunter-output/discovery.json" > "$RUNNER_TEMP/blind-discovery.sha256"
      - name: Pinned original RED, Fixer GREEN, unsafe VETO, Judge and rollback
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          jdk="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          node_root="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          mounts=(--ro-bind /usr /usr)
          for mount in /bin /lib /lib64; do
            if [ -L "$mount" ]; then
              target="$(readlink "$mount")"
              [[ "$target" != /* && "$target" != *..* ]] || exit 2
              mounts+=(--symlink "$target" "$mount")
            elif [ -d "$mount" ]; then mounts+=(--ro-bind "$mount" "$mount")
            else exit 2; fi
          done
          if ! env -i PATH=/usr/bin:/bin HOME=/tmp \
            /usr/bin/bwrap --die-with-parent --unshare-all --new-session --clearenv \
            --setenv PATH /jdk/bin:/node/bin:/usr/bin:/bin --setenv JAVA_HOME /jdk --setenv HOME /tmp \
            "${mounts[@]}" --ro-bind "$jdk" /jdk --ro-bind "$node_root" /node \
            --ro-bind "$RUNNER_TEMP/kotlin-blind/kotlinc" /kotlin --ro-bind "$GITHUB_WORKSPACE" /sentinel \
            --dir /blind --ro-bind "$RUNNER_TEMP/blind-hunter-output/discovery.json" /blind/discovery.json \
            --proc /proc --dev /dev --tmpfs /tmp --dir /home --chdir /sentinel -- \
            /bin/bash /sentinel/tests/fixtures/jarvis-elapsed-window/reproduce.sh \
            /sentinel/original-jarvis /kotlin /sentinel /blind/discovery.json \
            >> "$RUNNER_TEMP/blind-original-kotlin.log" 2>&1; then
            tail -80 "$RUNNER_TEMP/blind-original-kotlin.log" >&2
            exit 1
          fi
          sha256sum --check "$RUNNER_TEMP/blind-discovery.sha256"
          grep -Fxq 'blind_source_scan=PASS' "$RUNNER_TEMP/blind-original-kotlin.log"
          grep -Fxq 'executed_generic_jvm_judge=PASS' "$RUNNER_TEMP/blind-original-kotlin.log"
          grep -Fxq 'blind_source_count=66' "$RUNNER_TEMP/blind-original-kotlin.log"
          grep -Fxq 'blind_discovery_then_scoped_fixer=PASS (no verified repair yet)' "$RUNNER_TEMP/blind-original-kotlin.log"
          grep -Fq '"originalRed":true' "$RUNNER_TEMP/blind-original-kotlin.log"
          grep -Fq '"candidateGreen":true' "$RUNNER_TEMP/blind-original-kotlin.log"
          grep -Fq '"unsafeVeto":true' "$RUNNER_TEMP/blind-original-kotlin.log"
          grep -Fq '"exactGitTreeRestored":true' "$RUNNER_TEMP/blind-original-kotlin.log"
          grep -Fxq 'BLIND_KOTLIN_ORIGINAL_RED_GREEN_VETO_ROLLBACK=PASS' "$RUNNER_TEMP/blind-original-kotlin.log"
      - name: Publish sanitized blind research receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: phase2-blind-original-consent-oracle
          path: ${{ runner.temp }}/blind-original-kotlin.log
          retention-days: 14
          if-no-files-found: warn
