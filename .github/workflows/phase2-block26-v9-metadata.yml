name: Ultra Sentinel — v9 prospective fresh Kotlin metadata before blind invocation
on:
  pull_request:
    paths:
      - .github/workflows/phase2-block26-v9-metadata.yml
      - docs/quality/PHASE2-BLOCK26-V9-FREEZE.json
      - docs/quality/PHASE2-BLOCK26-V9-EXCLUSIONS.json
      - docs/quality/PHASE2-BLOCK26-V9-POOL.json
      - docs/quality/PHASE2-BLOCK26-V9-POOL-SEAL.json
      - packages/quality-gates/v9-effective-invocability.cjs
      - tests/unit/phase2-block26-v9-*.test.cjs
      - scripts/phase2-kotlin-api-v9-metadata.cjs
      - scripts/phase2-kotlin-api-v9-scout.cjs
permissions:
  contents: read
jobs:
  prospective-source-pool:
    if: >-
      github.event.repository.id == 1418338512 &&
      github.event.pull_request.head.repo.full_name == 'cardenaspiero255-lang/Ultra-Sentinel' &&
      github.event.pull_request.user.id == 322222186
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact protocol SHA without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pin Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Require full regressions and pre-source complete provenance freeze
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node --test tests/unit/phase2-block26-v9-effective-invocability.test.cjs tests/unit/phase2-block26-v9-prospective-freeze.test.cjs
      - name: Require 90 percent branch and line coverage of new invocation admission gate
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-test-coverage \
            --test-coverage-include=packages/quality-gates/v9-effective-invocability.cjs \
            --test-coverage-lines=90 --test-coverage-branches=90 \
            --test tests/unit/phase2-block26-v9-effective-invocability.test.cjs
      - name: Query unexposed original Kotlin Git metadata only, or replay sealed pool
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v9-metadata"
          if test -f docs/quality/PHASE2-BLOCK26-V9-POOL-SEAL.json; then
            node --test tests/unit/phase2-block26-v9-pool-seal.test.cjs
            cp docs/quality/PHASE2-BLOCK26-V9-POOL.json "$RUNNER_TEMP/v9-metadata/metadata.json"
            echo "V9_SEALED_METADATA_REPLAY_NO_NEW_SELECTION"
          else
            node scripts/phase2-kotlin-api-v9-metadata.cjs "$RUNNER_TEMP/v9-metadata"
          fi
          test -s "$RUNNER_TEMP/v9-metadata/metadata.json"
      - name: Preserve exact metadata reservation for prospective commit before code access
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: block26-v9-metadata-before-hunter
          path: ${{ runner.temp }}/v9-metadata/metadata.json
          if-no-files-found: error
          retention-days: 90
