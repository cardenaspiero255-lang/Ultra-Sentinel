name: GameHub read-only live verification
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "GameHub Ultra PR number"
        required: true
        default: "201"
permissions:
  contents: read
concurrency:
  group: gamehub-readonly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gamehub-live-reader:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout trusted branch without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify read-only GitHub evidence without running PR code
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ inputs.pr_number || '201' }}
        run: node scripts/gamehub-readonly-check.cjs "$TARGET_PR"
